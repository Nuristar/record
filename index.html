<style>
/* Layout: phone-first app shell. Sticky top bar, one scrolling column (max 640px), fixed bottom tab bar.
   Look: archive finding aid. Standard numbers in mono like call numbers, titles in a documentary serif,
   and a red retention stamp used only for results and "check the latest text" warnings. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#E2E7ED; --ink:#14233A; --ink-2:#4B5B73; --line:#C9D2DD;
  --accent:#0B6A74; --accent-ink:#FFFFFF; --accent-soft:#D6ECEE;
  --stamp:#B03A2E; --stamp-soft:#F6E0DC;
  --good:#1D7B4C; --good-soft:#D9EEE3; --warn:#8F5A00; --warn-soft:#F7EACB;
  --f-display:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --f-body:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1622; --surface:#162131; --surface-2:#1F2D42; --ink:#E5ECF5; --ink-2:#9FB1C8; --line:#2B3B52;
    --accent:#4FC1C9; --accent-ink:#06222A; --accent-soft:#143A42;
    --stamp:#FF8F80; --stamp-soft:#432320;
    --good:#5ED192; --good-soft:#173A29; --warn:#F2BC52; --warn-soft:#3F3216;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1622; --surface:#162131; --surface-2:#1F2D42; --ink:#E5ECF5; --ink-2:#9FB1C8; --line:#2B3B52;
  --accent:#4FC1C9; --accent-ink:#06222A; --accent-soft:#143A42;
  --stamp:#FF8F80; --stamp-soft:#432320;
  --good:#5ED192; --good-soft:#173A29; --warn:#F2BC52; --warn-soft:#3F3216;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  color:var(--ink); font:15px/1.65 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
.brand{font:700 19px/1.2 var(--f-display);letter-spacing:-.01em;margin:0}
.brand small{display:block;font:500 11px/1.4 var(--f-mono);color:var(--ink-2);letter-spacing:.04em;margin-top:2px}
.dday{font:500 13px var(--f-mono);border:1px solid var(--accent);color:var(--accent);padding:3px 9px;border-radius:4px;white-space:nowrap;background:var(--surface);cursor:pointer}
main{padding-top:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font:700 21px/1.35 var(--f-display);margin:0;text-wrap:balance}
h3{font:600 15px/1.4 var(--f-body);margin:0}
p{margin:0}
.sub{color:var(--ink-2);font-size:14px}
.mono{font-family:var(--f-mono)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card.flat{background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:8px;font-weight:500;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:6px;font-size:14px;font-weight:500;color:var(--ink-2);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tag{display:inline-block;font:500 11.5px/1.5 var(--f-mono);letter-spacing:.02em;color:var(--ink-2);background:var(--surface-2);padding:1px 7px;border-radius:3px}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.stamp{display:inline-block;font:500 12px/1.3 var(--f-mono);letter-spacing:.08em;color:var(--stamp);border:2px solid var(--stamp);padding:3px 8px;border-radius:3px;transform:rotate(-2deg)}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.good>i{background:var(--good)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:500 24px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.item .t{font:600 16px/1.4 var(--f-display)}
.item .done{color:var(--good);font-size:12.5px;font-weight:600}
.back{align-self:flex-start;border:0;background:transparent;color:var(--accent);padding:6px 0;font-weight:500;min-height:36px}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pts li{position:relative;padding-left:18px}
.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;background:var(--accent);border-radius:1px}
.tip{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tip b{color:var(--accent);font-size:13px}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.notice b{color:var(--warn);font-size:13px}
.terms{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 12px;font-size:14px}
.terms .en{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
select,input[type=date],input[type=search],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:150px;line-height:1.6}
.choice{display:flex;gap:10px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:48px;align-items:flex-start}
.choice .k{font:500 13px/1.7 var(--f-mono);color:var(--ink-2);min-width:16px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--stamp);background:var(--stamp-soft)}
.q{font:600 17px/1.55 var(--f-display);text-wrap:pretty}
.out{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}
.bubble{padding:10px 14px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:92%}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;min-height:36px}
.flash{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer}
.flash .big{font:700 24px/1.3 var(--f-display)}
.flash .en{font:500 20px/1.4 var(--f-mono);overflow-wrap:anywhere}
.msg{font-size:13.5px;color:var(--ink-2)}
.msg.err{color:var(--stamp)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px))}
.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:500;color:var(--ink-2);min-height:56px}
.tabs button[aria-current="true"]{color:var(--accent)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hist{display:flex;flex-direction:column;gap:6px}
.hist button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:40px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;text-align:center}
a.btn.primary{color:var(--accent-ink)}
details.art{border-top:1px solid var(--line);padding:6px 0 12px}
details.art>summary{cursor:pointer;min-height:44px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;list-style-position:inside}
.art-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-size:14.5px;margin:6px 0 12px}
.art-body .ln{display:block;margin-bottom:5px}
.art-body .l2{padding-left:1.1em}
.art-body .l3{padding-left:2.2em}
.art-body .nt{color:var(--ink-3,var(--ink-2));font-size:12.5px;margin-top:4px}
.ln.chg{background:var(--warn-soft);border-radius:4px;padding-top:1px;padding-bottom:1px;box-shadow:-4px 0 0 var(--warn-soft),4px 0 0 var(--warn-soft)}
.tag.pend{background:var(--warn-soft);color:var(--warn)}
details.nx{border:1px dashed var(--line);border-radius:8px;padding:2px 10px;margin:4px 0 12px}
details.nx>summary{cursor:pointer;min-height:40px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--warn)}
.chap{font:600 12.5px/1.4 var(--f-mono);color:var(--accent);padding:18px 0 6px;letter-spacing:.02em}
.memo{min-height:70px}
@media (prefers-reduced-motion:no-preference){.btn,.choice,.item{transition:background .15s,border-color .15s}}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
input[type=search]{-webkit-appearance:none;appearance:none}
.pair{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:5px}
.pair:first-child{border-top:0;padding-top:0}
.en-src{font:400 13px/1.55 var(--f-mono);color:var(--ink-2);overflow-wrap:anywhere}
.ko{font-weight:500;overflow-wrap:anywhere}
</style>

const AREAS={kr:'국내',intl:'해외',theory:'이론'};

{id:'kr7',area:'kr',code:'개정 동향',title:'최근 법·제도 개정 동향',sub:'2026. 10. 13. 개정 · 2027. 4. 14. 시행 예정',
 points:['법제처 법률 본문(시행 2025. 10. 1. 기준)에 「2026. 10. 13. 개정, 2027. 4. 14. 시행」으로 표시된 조문이 있다: 제3조, 제9조, 제14조의2(신설), 제15조, 제15조의2(신설), 제19조, 제38조, 제43~45조, 제45조의2(신설). 법령 탭의 "시행예정" 탭에서 현행과 비교해 볼 수 있다.',
  '준기록관 신설(제14조의2): 기록관이나 특수기록관 설치 대상이 아닌 공공기관 중 대통령령으로 정하는 기관은 기관장이 지정하는 부서(준기록관)에서 기록물을 관리한다. 이에 맞춰 제19조의 이관 주체에 준기록관이 들어간다.',
  '제19조 이관: 기록관 등이 영구기록물관리기관으로 이관하는 대상이 현행 "보존기간 30년 이상 기록물"에서 "보존기간이 영구인 기록물과 대통령령으로 정하는 기록물"로 바뀐다.',
  '제3조·제9조: 정의에 민간기록물·국외기록물(제6·7호)이 추가되고, 행정안전부장관이 공공기록물뿐 아니라 민간기록물·국외기록물 관리에 대한 지원 등을 총괄·조정하는 규정이 들어가고, 중앙기록물관리기관의 업무에 "기록물의 보존 및 관리"와 보존·복원 지원이 추가된다.',
  '제38조 기록물공개심의회: 위원 수가 7명에서 7명 이상 15명 이하로, 임기가 2년에서 3년으로 바뀌고, 위원 중 3분의 2 이상을 공무원이 아닌 사람으로 위촉하도록 한다.',
  '제43~45조 국가지정기록물: 지정·해제·변동신고·보존 업무의 주체가 "중앙기록물관리기관의 장"에서 "행정안전부장관"으로 바뀌고 추천위원회 근거가 생긴다. 제45조의2로 지방자치단체지정기록물 제도가 신설된다.',
  '제15조의2(신설)로 위원회 심의를 위한 관계 공공기관의 자료 제출·협조 근거가 마련되고, 제15조에 전문위원회·특별위원회 심의 위임 규정(제9항)이 추가된다.',
  '참고: 2024년 8월 입법예고안(법률명을 「국가기록물법」으로 변경 등)과 2025년 10월 시행령 개정안(보존기간 축소 등)은 별도의 입법 논의였다. 위 시행예정 조문은 법제처 본문에 표시된 내용만 정리한 것이다.'],
 terms:[['준기록관','quasi-records center (설명용 표현)']],
 notice:'시행예정 조문은 2027. 4. 14. 시행 전까지 현행법이 적용됩니다. 시행령·시행규칙 개정 여부와 최종 조문은 국가법령정보센터에서 반드시 확인하세요.',
 exam:'시험은 보통 "시험일 현재 시행 중인 법령" 기준입니다. 시행예정 조문을 현행 규정으로 착각하지 않는 것이 핵심이며, 시험 시점이 2027. 4. 14. 이후라면 새 규정을 기준으로 봐야 합니다.'},

/* ───────── 상태 저장 ───────── */
const KEY='rk-standards-v1';
let S;
function load(){let o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  S=Object.assign({examDate:'',streak:{last:'',n:0},read:{},cards:{},wrong:{},stats:{},bm:{},gen:[],hist:[],tr:[],newToday:{d:'',n:0},abm:{},memo:{},set:{email:''}},o||{})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)}
function diffDays(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function touch(){const t=today();if(S.streak.last===t)return;S.streak.n=(S.streak.last===addDays(t,-1))?S.streak.n+1:1;S.streak.last=t;save()}

/* ───────── DOM 도우미 ───────── */
function h(tag,attrs){const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];
    if(k==='class')e.className=v;else if(k==='on'){for(const ev in v)e.addEventListener(ev,v[ev])}
    else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
  for(let i=2;i<arguments.length;i++){const kids=[arguments[i]].flat(Infinity);
    for(const c of kids){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}}
  return e}
const card=(...k)=>h('div',{class:'card'},...k);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const allQ=()=>QS.concat(S.gen);
const qById=id=>allQ().find(q=>q.id===id);
const topicById=id=>TOPICS.find(t=>t.id===id);

/* ───────── 공통 통계 ───────── */
function totals(){let ok=0,no=0;for(const k in S.stats){ok+=S.stats[k].ok||0;no+=S.stats[k].no||0}return{ok,no,n:ok+no,acc:ok+no?Math.round(100*ok/(ok+no)):0}}
function dueInfo(){const t=today();let due=0;for(let i=0;i<TERMS.length;i++){const c=S.cards[i];if(c&&c.due<=t)due++}
  const fresh=TERMS.length-Object.keys(S.cards).length;const used=S.newToday.d===t?S.newToday.n:0;return{due,fresh:Math.max(0,Math.min(fresh,10-used))}}
function areaProgress(a){const ts=TOPICS.filter(t=>t.area===a);const r=ts.filter(t=>S.read[t.id]).length;return{r,n:ts.length}}

    h('button',{class:'item',type:'button',on:{click:()=>{nav.topic=t.id;render();window.scrollTo(0,0)}}},

function glossary(){

    TERMS.filter(t=>!s||t[0].toLowerCase().includes(s)||t[1].toLowerCase().includes(s)||t[2].includes(s)).forEach(t=>

const BUILTIN={"law":{"name":"공공기록물 관리에 관한 법률","info":"[시행 2025. 10. 1.] [법률 제21066호, 2025. 10. 1., 타법개정]","src":"국가법령정보센터(법제처) 본문","saved":"내장본","builtin":1,"arts":[{"id":"제1조","label":"제1조","title":"목적","chap":"제1장 총칙","text":"이 법은 공공기관의 투명하고 책임 있는 행정 구현과 공공기록물의 안전한 보존 및 효율적 활용을 위하여 공공기록물 관리에 필요한 사항을 정함을 목적으로 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제2조","label":"제2조","title":"적용 범위","chap":"제1장 총칙","text":"이 법은 공공기관이 업무와 관련하여 생산ㆍ접수한 기록물과 개인 또는 단체가 생산ㆍ취득한 기록정보 자료(공공기관이 소유ㆍ관리하는 기록정보 자료를 포함한다) 중 국가적으로 보존할 가치가 있다고 인정되는 기록정보 자료 등 공공기록물에 대하여 적용한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제3조","label":"제3조","title":"정의","chap":"제1장 총칙","text":"이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1. “공공기관”이란 국가기관, 지방자치단체, 그 밖에 대통령령으로 정하는 기관을 말한다.\n2. “기록물”이란 공공기관이 업무와 관련하여 생산하거나 접수한 문서ㆍ도서ㆍ대장ㆍ카드ㆍ도면ㆍ시청각물ㆍ전자문서 등 모든 형태의 기록정보 자료와 행정박물(行政博物)을 말한다.\n3. “기록물관리”란 기록물의 생산ㆍ분류ㆍ정리ㆍ이관(移管)ㆍ수집ㆍ평가ㆍ폐기ㆍ보존ㆍ공개ㆍ활용 및 이에 부수되는 모든 업무를 말한다.\n4. “기록물관리기관”이란 일정한 시설 및 장비와 이를 운영하기 위한 전문인력을 갖추고 기록물관리 업무를 수행하는 기관을 말하며, 영구기록물관리기관, 기록관 및 특수기록관으로 구분한다.\n5. “영구기록물관리기관”이란 기록물의 영구보존에 필요한 시설 및 장비와 이를 운영하기 위한 전문인력을 갖추고 기록물을 영구적으로 관리하는 기관을 말하며, 중앙기록물관리기관, 헌법기관기록물관리기관, 지방기록물관리기관 및 대통령기록관으로 구분한다.","note":"[전문개정 2012. 3. 21.]","next":{"eff":"2027-04-14","title":"정의","text":"이 법에서 사용하는 용어의 뜻은 다음과 같다. <개정 2026. 10. 13.>\n1. “공공기관”이란 국가기관, 지방자치단체, 그 밖에 대통령령으로 정하는 기관을 말한다.\n2. “기록물”이란 공공기관이 업무와 관련하여 생산하거나 접수한 문서ㆍ도서ㆍ대장ㆍ카드ㆍ도면ㆍ시청각물ㆍ전자문서 등 모든 형태의 기록정보 자료와 행정박물(行政博物)을 말한다.\n3. “기록물관리”란 기록물의 생산ㆍ분류ㆍ정리ㆍ이관(移管)ㆍ수집ㆍ평가ㆍ폐기ㆍ보존ㆍ공개ㆍ활용 및 이에 부수되는 모든 업무를 말한다.\n4. “기록물관리기관”이란 일정한 시설 및 장비와 이를 운영하기 위한 전문인력을 갖추고 기록물관리 업무를 수행하는 기관을 말하며, 영구기록물관리기관, 기록관 및 특수기록관으로 구분한다.\n5. “영구기록물관리기관”이란 기록물의 영구보존에 필요한 시설 및 장비와 이를 운영하기 위한 전문인력을 갖추고 기록물을 영구적으로 관리하는 기관을 말하며, 중앙기록물관리기관, 헌법기관기록물관리기관, 지방기록물관리기관 및 대통령기록관으로 구분한다.\n6. “민간기록물”이란 개인이나 단체가 생산하거나 취득한 기록정보 자료 등을 말한다.\n7. “국외기록물”이란 국외에 소재하는 기록정보 자료 중 국가적으로 보존할 가치가 있다고 인정되는 것을 말한다.","note":"[전문개정 2012. 3. 21.]"}},{"id":"제4조","label":"제4조","title":"공무원 등의 의무","chap":"제1장 총칙","text":"① 모든 공무원과 공공기관의 임직원은 이 법에서 정하는 바에 따라 기록물을 보호ㆍ관리할 의무를 갖는다. <개정 2019. 12. 3.>\n② 공공기관 및 기록물관리기관의 장은 기록물이 국민에게 공개되어 활용될 수 있도록 적극적으로 노력하여야 한다.","note":"[전문개정 2012. 3. 21.] [제목개정 2019. 12. 3.]"},{"id":"제5조","label":"제5조","title":"기록물관리의 원칙","chap":"제1장 총칙","text":"공공기관 및 기록물관리기관의 장은 기록물의 생산부터 활용까지의 모든 과정에 걸쳐 진본성(眞本性), 무결성(無缺性), 신뢰성 및 이용가능성이 보장될 수 있도록 관리하여야 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제6조","label":"제6조","title":"기록물의 전자적 생산ㆍ관리","chap":"제1장 총칙","text":"공공기관 및 기록물관리기관의 장은 기록물이 전자적으로 생산ㆍ관리되도록 필요한 조치를 마련하여야 하며, 전자적 형태로 생산되지 아니한 기록물도 전자적으로 관리되도록 노력하여야 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제7조","label":"제7조","title":"기록물관리의 표준화 원칙","chap":"제1장 총칙","text":"중앙기록물관리기관의 장은 기록물이 효율적이고 통일적으로 관리ㆍ활용될 수 있도록 기록물관리의 표준화를 위한 정책을 수립하여 시행하여야 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제8조","label":"제8조","title":"다른 법률과의 관계","chap":"제1장 총칙","text":"기록물관리에 관하여 다른 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제9조","label":"제9조","title":"중앙기록물관리기관","chap":"제2장 기록물관리기관","text":"① 기록물관리를 총괄ㆍ조정하고 기록물을 영구보존ㆍ관리하기 위하여 행정안전부장관은 그 소속으로 영구기록물관리기관을 설치ㆍ운영하여야 한다. <개정 2013. 3. 23., 2014. 11. 19., 2017. 7. 26.>\n② 제1항에 따라 행정안전부장관 소속으로 설치ㆍ운영되는 영구기록물관리기관(이하 “중앙기록물관리기관”이라 한다)은 다음 각 호의 업무를 수행한다.<개정 2013. 3. 23., 2014. 11. 19., 2017. 7. 26., 2019. 12. 3.>\n1. 기록물관리에 관한 기본정책의 수립 및 제도의 개선\n2. 기록물관리 표준화 정책의 수립 및 기록물관리 표준의 개발ㆍ운영\n3. 기록물관리 및 기록물관리 관련 통계의 작성ㆍ관리\n4. 기록물의 전자적 관리체계 구축 및 표준화\n5. 기록물관리의 방법 및 보존기술의 연구ㆍ보급\n6. 기록물관리에 관한 교육ㆍ훈련\n7. 기록물관리에 관한 지도ㆍ감독 및 평가\n8. 다른 기록물관리기관과의 연계ㆍ협조\n9. 기록물관리에 관한 교류ㆍ협력\n10. 그 밖에 이 법에서 정하는 사항\n③ 중앙기록물관리기관의 장은 공공기관으로부터 이관받은 기록물을 효율적으로 관리하기 위하여 필요한 경우에는 중간 관리시설을 설치ㆍ운영할 수 있다.\n④ 중앙기록물관리기관의 장은 국가의 기록물관리를 총괄ㆍ조정하기 위하여 제3조제5호의 영구기록물관리기관의 장과 협의체를 구성하여 운영할 수 있다.<신설 2019. 12. 3.>","note":"[전문개정 2012. 3. 21.]","next":{"eff":"2027-04-14","title":"중앙기록물관리기관","text":"① 행정안전부장관은 공공기관의 기록물관리와 민간기록물 및 국외기록물 관리에 대한 지원 등을 총괄ㆍ조정한다. <개정 2026. 10. 13.>\n② 행정안전부장관은 제1항의 사항과 다음 각 호의 업무를 수행하기 위하여 그 소속으로 영구기록물관리기관(이하 “중앙기록물관리기관”이라 한다)을 설치ㆍ운영하여야 한다.<개정 2013. 3. 23., 2014. 11. 19., 2017. 7. 26., 2019. 12. 3., 2026. 10. 13.>\n1. 기록물관리에 관한 기본정책의 수립 및 제도의 개선\n2. 기록물관리 표준화 정책의 수립 및 기록물관리 표준의 개발ㆍ운영\n3. 기록물관리 및 기록물관리 관련 통계의 작성ㆍ관리\n4. 기록물의 전자적 관리체계 구축 및 표준화\n5. 기록물관리의 방법 및 보존기술의 연구ㆍ보급\n6. 기록물관리에 관한 교육ㆍ훈련\n7. 기록물관리에 관한 지도ㆍ감독 및 평가\n8. 다른 기록물관리기관과의 연계ㆍ협조\n9. 기록물관리에 관한 교류ㆍ협력\n10. 기록물의 보존 및 관리\n11. 그 밖에 이 법에서 정하는 사항\n③ 중앙기록물관리기관의 장은 공공기관으로부터 이관받은 기록물을 효율적으로 관리하기 위하여 필요한 경우에는 중간 관리시설을 설치ㆍ운영할 수 있다.\n④ 행정안전부장관은 제1항의 사항을 효율적으로 추진하기 위하여 중앙기록물관리기관의 장으로 하여금 제3조제5호의 영구기록물관리기관의 장과 협의체를 구성하여 운영하게 할 수 있다.<신설 2019. 12. 3., 2026. 10. 13.>\n⑤ 중앙기록물관리기관의 장은 공공기관의 기록물과 국가적으로 보존가치가 높은 민간기록물 및 국외기록물의 온전하고 효율적인 관리를 위하여 보존ㆍ복원 등 기록물관리에 필요한 사항을 지원하거나 대통령령으로 정하는 바에 따라 해당 공공기관의 장 또는 해당 기록물의 소유자ㆍ관리자와 협의하여 이를 대신 수행할 수 있다.<신설 2026. 10. 13.>","note":"[전문개정 2012. 3. 21.]"}},{"id":"제10조","label":"제10조","title":"헌법기관기록물관리기관","chap":"제2장 기록물관리기관","text":"① 국회, 대법원, 헌법재판소 및 중앙선거관리위원회는 소관 기록물의 영구보존 및 관리를 위하여 영구기록물관리기관을 설치ㆍ운영할 수 있다. 이 경우 영구기록물관리기관을 설치ㆍ운영하지 아니할 때에는 대통령령으로 정하는 바에 따라 중앙기록물관리기관에 소관 기록물의 관리를 위탁하여야 한다.\n② 제1항에 따라 국회, 대법원, 헌법재판소 및 중앙선거관리위원회에 설치ㆍ운영하는 영구기록물관리기관(이하 “헌법기관기록물관리기관”이라 한다)은 다음 각 호의 업무를 수행한다.<개정 2019. 12. 3.>\n1. 관할 공공기관의 기록물관리에 관한 기본계획의 수립ㆍ시행\n2. 관할 공공기관의 기록물관리 및 기록물관리 관련 통계의 작성ㆍ관리\n3. 관할 공공기관의 기록물관리에 관한 지도ㆍ감독 및 지원\n4. 중앙기록물관리기관과의 협조에 의한 기록물의 상호활용 및 보존의 분담\n5. 관할 공공기관의 기록물관리에 관한 교육ㆍ훈련\n6. 다른 기록물관리기관과의 연계ㆍ협조\n7. 그 밖에 기록물관리에 관한 사항\n③ 헌법기관기록물관리기관의 장은 중앙기록물관리기관의 장이 기록물관리에 대한 표준의 이행과 기록물관리 관련 통계현황 등 기록물의 효율적 관리를 위하여 필요한 사항에 관하여 협조를 요청하면 협조하여야 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제11조","label":"제11조","title":"지방기록물관리기관","chap":"제2장 기록물관리기관","text":"① 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ도지사 또는 특별자치도지사는 소관 기록물의 영구보존 및 관리를 위하여 특별시ㆍ광역시ㆍ특별자치시ㆍ도 또는 특별자치도(이하 “시ㆍ도”라 한다)의 조례로 정하는 바에 따라 영구기록물관리기관(이하 “시ㆍ도기록물관리기관”이라 한다)을 설치ㆍ운영하여야 한다.\n② 특별시ㆍ광역시ㆍ특별자치시ㆍ도ㆍ특별자치도 교육감(이하 “시ㆍ도교육감”이라 한다)은 소관 기록물의 영구보존 및 관리를 위하여 시ㆍ도의 조례로 정하는 바에 따라 영구기록물관리기관(이하 “시ㆍ도교육청기록물관리기관”이라 한다)을 설치ㆍ운영할 수 있다. 이 경우 시ㆍ도교육감이 시ㆍ도교육청기록물관리기관을 설치ㆍ운영하지 아니할 때에는 대통령령으로 정하는 바에 따라 소관 기록물을 시ㆍ도기록물관리기관에 이관하여야 한다.\n③ 시장ㆍ군수ㆍ구청장(자치구의 구청장을 말한다. 이하 같다)은 소관 기록물의 영구보존 및 관리를 위하여 시ㆍ군ㆍ자치구의 조례로 정하는 바에 따라 영구기록물관리기관(이하 “시ㆍ군ㆍ구기록물관리기관”이라 한다)을 설치ㆍ운영할 수 있다. 이 경우 시장ㆍ군수ㆍ구청장이 시ㆍ군ㆍ구기록물관리기관을 설치ㆍ운영하지 아니할 때에는 대통령령으로 정하는 바에 따라 소관 기록물을 시ㆍ도기록물관리기관에 이관하여야 한다.\n④ 시ㆍ도기록물관리기관의 장은 제2항 전단 또는 제3항 전단에 따라 시ㆍ도교육청기록물관리기관 또는 시ㆍ군ㆍ구기록물관리기관이 설치ㆍ운영되는 경우에는 제2항 후단 또는 제3항 후단에 따라 이관받은 기록물을 시ㆍ도교육청기록물관리기관 또는 시ㆍ군ㆍ구기록물관리기관에 이관하여야 한다.<신설 2022. 1. 11.>\n⑤ 지방자치단체의 장은 기록물관리를 효율적으로 하기 위하여 필요한 경우에는 대통령령으로 정하는 바에 따라 영구기록물관리기관을 공동으로 설치ㆍ운영할 수 있다.<개정 2022. 1. 11.>\n⑥ 시ㆍ도기록물관리기관(제2항 후단 및 제3항 후단에 따라 시ㆍ도교육감 또는 시장ㆍ군수ㆍ구청장이 소관 기록물을 시ㆍ도기록물관리기관으로 이관하여야 하는 경우를 포함한다), 시ㆍ도교육청기록물관리기관, 시ㆍ군ㆍ구기록물관리기관 및 제5항에 따라 공동으로 설치ㆍ운영되는 영구기록물관리기관(이하 “지방기록물관리기관”이라 한다)은 다음 각 호의 업무를 수행한다.<개정 2019. 12. 3., 2022. 1. 11.>\n1. 관할 공공기관의 기록물관리에 관한 기본계획의 수립ㆍ시행\n2. 관할 공공기관의 기록물관리 및 기록물관리 관련 통계의 작성ㆍ관리\n3. 관할 공공기관의 기록물관리에 관한 지도ㆍ감독 및 지원. 다만, 제2항 후단 및 제3항 후단에 따라 소관 기록물을 이관하여야 하는 공공기관의 경우에는 해당 공공기관의 기록물관리에 대한 시ㆍ도기록물관리기관의 지도로 한정한다.\n4. 관할 공공기관의 기록물관리에 관한 교육ㆍ훈련\n5. 중앙기록물관리기관과의 협조에 의한 기록물의 상호활용 및 보존의 분담\n6. 다른 기록물관리기관과의 연계ㆍ협조\n7. 삭제<2019. 12. 3.>\n8. 그 밖에 기록물관리에 관한 사항\n⑦ 국가는 지방기록물관리기관의 설치ㆍ운영에 필요한 경비의 일부를 예산의 범위에서 보조할 수 있다.<개정 2022. 1. 11.>\n⑧ 지방기록물관리기관의 장은 중앙기록물관리기관의 장이 기록물관리에 대한 표준의 이행, 국가위임사무에 관한 기록물의 원본 또는 사본의 이관, 그 밖에 기록물관리 관련 통계현황 등 기록물의 효율적 관리를 위하여 필요한 사항에 관하여 협조를 요청하면 협조하여야 한다.<개정 2022. 1. 11.>","note":"[전문개정 2012. 3. 21.]"},{"id":"제12조","label":"제12조","title":"삭제","chap":"제2장 기록물관리기관","text":"삭제 <2007. 4. 27.>"},{"id":"제13조","label":"제13조","title":"기록관","chap":"제2장 기록물관리기관","text":"① 공공기관의 기록물을 효율적으로 관리하기 위하여 대통령령으로 정하는 공공기관은 기록관을 설치ㆍ운영하여야 한다. 다만, 제14조에 따른 특수기록관을 설치ㆍ운영하는 공공기관의 경우에는 그 공공기관 내에 기록관을 설치할 수 없다.\n② 기록관은 다음 각 호의 업무를 수행한다.<개정 2019. 12. 3.>\n1. 관할 공공기관의 기록물관리에 관한 기본계획의 수립ㆍ시행\n2. 해당 공공기관의 기록물관리\n3. 기록관이 설치되지 아니한 관할 공공기관의 기록물관리\n4. 해당 공공기관의 기록물에 대한 정보공개 청구의 접수\n5. 관할 공공기관의 기록물관리에 대한 지도ㆍ감독 및 지원\n6. 관할 공공기관의 기록물관리에 관한 교육ㆍ훈련\n7. 다른 기록물관리기관과의 연계ㆍ협조\n8. 그 밖에 기록물관리에 관한 사항","note":"[전문개정 2012. 3. 21.]"},{"id":"제14조","label":"제14조","title":"특수기록관","chap":"제2장 기록물관리기관","text":"① 통일ㆍ외교ㆍ안보ㆍ수사ㆍ정보 분야의 기록물을 생산하는 공공기관의 장은 소관 기록물을 장기간 관리하려는 경우에는 중앙기록물관리기관의 장과 협의하여 특수기록관을 설치ㆍ운영할 수 있다.\n② 특수기록관은 제28조제1항에 따른 시설ㆍ장비와 이를 운영하기 위한 전문인력을 갖추어야 한다.\n③ 특수기록관은 다음 각 호의 업무를 수행한다.<개정 2019. 12. 3.>\n1. 관할 공공기관의 기록물관리에 관한 기본계획의 수립ㆍ시행\n2. 해당 공공기관의 기록물관리\n3. 특수기록관이 설치되지 아니한 관할 공공기관의 기록물관리\n4. 해당 공공기관의 기록물에 대한 정보공개 청구의 접수\n5. 관할 공공기관의 기록물관리에 대한 지도ㆍ감독 및 지원\n6. 관할 공공기관의 기록물관리에 관한 교육ㆍ훈련\n7. 다른 기록물관리기관과의 연계ㆍ협조\n8. 그 밖에 기록물관리에 관한 사항","note":"[전문개정 2012. 3. 21.]"},{"id":"제14조의2","label":"제14조의2","title":"준기록관","chap":"제2장 기록물관리기관","text":"","next":{"eff":"2027-04-14","title":"준기록관","text":"제13조제1항에 따른 기록관 또는 제14조제1항에 따른 특수기록관의 설치 대상이 아닌 공공기관으로서 대통령령으로 정하는 기관은 해당 공공기관의 장이 지정하는 부서(이하 “준기록관”이라 한다)에서 기록물을 관리하도록 하여야 한다.","note":"[본조신설 2026. 10. 13.]"},"fresh":1},{"id":"제15조","label":"제15조","title":"국가기록관리위원회","chap":"제3장 국가기록관리위원회","text":"① 다음 각 호의 사항을 심의하기 위하여 행정안전부장관 소속으로 국가기록관리위원회(이하 “위원회”라 한다)를 둔다. <개정 2019. 12. 3., 2022. 1. 11., 2023. 5. 16.>\n1. 국가 기록물관리에 관한 기본정책의 수립\n2. 기록물관리 표준의 제정ㆍ개정 및 폐지\n3. 영구기록물관리기관 간의 협력 및 협조 사항\n4. 대통령 기록물의 관리\n5. 제19조제5항 및 제6항에 따른 비공개 기록물의 이관시기 연장 승인 및 제35조제4항에 따른 비공개 기록물의 비공개 기간 연장\n6. 국가지정기록물의 지정 및 해제\n7. 그 밖에 기록물관리와 관련하여 위원회의 위원장이 심의에 부치는 사항\n② 위원회는 위원장 1명과 부위원장 1명을 포함하여 20명 이내의 위원으로 구성하고, 위원은 다음 각 호의 사람 중에서 행정안전부장관이 임명하거나 위촉한다.<개정 2019. 12. 3., 2023. 5. 16.>\n1. 헌법기관기록물관리기관의 장\n2. 중앙기록물관리기관의 장\n3. 대통령기록관의 장\n4. 지방기록물관리기관의 장 간의 협의를 통하여 선정한 지방기록물관리기관의 장 1명\n5. 기록물관리에 관한 학식과 경험이 풍부한 사람\n③ 위원회의 위원장은 행정안전부장관이 위원 중에서 임명하거나 위촉하고, 부위원장은 위원 중에서 호선한다. <개정 2019. 12. 3., 2023. 5. 16.>\n④ 제2항제5호에 따른 위원의 임기는 3년으로 하며, 한 차례만 연임할 수 있다. 다만, 위원의 사임 등으로 새로 위촉된 위원의 임기는 전임위원 임기의 남은 기간으로 한다.<개정 2019. 12. 3.>\n⑤ 행정안전부장관은 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원을 해임 또는 해촉(解囑)할 수 있다.<신설 2017. 3. 21., 2019. 12. 3., 2023. 5. 16.>\n1. 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n2. 직무와 관련한 형사사건으로 기소된 경우\n3. 위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우\n4. 직무태만, 품위손상이나 그 밖의 사유로 인하여 위원으로 적합하지 아니하다고 인정되는 경우\n⑥ 위원회는 다음 각 호의 사항을 적은 회의록을 작성ㆍ보존하여야 한다. 이 경우 필요하다고 인정되면 속기ㆍ녹음 또는 녹화를 할 수 있다.<개정 2017. 3. 21.>\n1. 일시 및 장소\n2. 참석위원의 수 및 성명\n3. 그 밖에 참석자 및 배석자의 성명\n4. 상정안건 및 결정사항\n5. 그 밖의 토의사항\n⑦ 위원회의 사무를 지원하기 위하여 위원회에 간사 1명을 두며, 간사는 중앙기록물관리기관의 소속 공무원으로 한다.<개정 2017. 3. 21.>\n⑧ 위원회의 효율적인 운영을 위하여 위원회에 전문위원회나 특별위원회를 둔다.<개정 2017. 3. 21.>\n⑨ 제1항부터 제8항까지에서 정한 사항 외에 위원회, 전문위원회 및 특별위원회의 구성 및 운영 등에 필요한 사항은 대통령령으로 정한다.<개정 2017. 3. 21.>","note":"[전문개정 2012. 3. 21.]","next":{"eff":"2027-04-14","title":"국가기록관리위원회","text":"① 다음 각 호의 사항을 심의하기 위하여 행정안전부장관 소속으로 국가기록관리위원회(이하 “위원회”라 한다)를 둔다. <개정 2019. 12. 3., 2022. 1. 11., 2023. 5. 16., 2026. 10. 13.>\n1. 국가 기록물관리에 관한 기본정책의 수립\n2. 기록물관리 표준의 제정ㆍ개정 및 폐지\n3. 영구기록물관리기관 간의 협력 및 협조 사항\n4. 대통령 기록물의 관리\n5. 제19조제5항 및 제6항에 따른 비공개 기록물의 이관시기 연장 승인 및 제35조제4항에 따른 비공개 기록물의 비공개 기간 연장\n6. 국가지정기록물의 지정 및 해제\n7. 그 밖에 기록물관리와 관련하여 대통령령으로 정하는 사항 및 위원회의 위원장이 심의에 부치는 사항\n② 위원회는 위원장 1명과 부위원장 1명을 포함하여 20명 이내의 위원으로 구성하고, 위원은 다음 각 호의 사람 중에서 행정안전부장관이 임명하거나 위촉한다.<개정 2019. 12. 3., 2023. 5. 16.>\n1. 헌법기관기록물관리기관의 장\n2. 중앙기록물관리기관의 장\n3. 대통령기록관의 장\n4. 지방기록물관리기관의 장 간의 협의를 통하여 선정한 지방기록물관리기관의 장 1명\n5. 기록물관리에 관한 학식과 경험이 풍부한 사람\n③ 위원회의 위원장은 행정안전부장관이 위원 중에서 임명하거나 위촉하고, 부위원장은 위원 중에서 호선한다. <개정 2019. 12. 3., 2023. 5. 16.>\n④ 제2항제5호에 따른 위원의 임기는 3년으로 하며, 한 차례만 연임할 수 있다. 다만, 위원의 사임 등으로 새로 위촉된 위원의 임기는 전임위원 임기의 남은 기간으로 한다.<개정 2019. 12. 3.>\n⑤ 행정안전부장관은 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원을 해임 또는 해촉(解囑)할 수 있다.<신설 2017. 3. 21., 2019. 12. 3., 2023. 5. 16.>\n1. 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n2. 직무와 관련한 형사사건으로 기소된 경우\n3. 위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우\n4. 직무태만, 품위손상이나 그 밖의 사유로 인하여 위원으로 적합하지 아니하다고 인정되는 경우\n⑥ 위원회는 다음 각 호의 사항을 적은 회의록을 작성ㆍ보존하여야 한다. 이 경우 필요하다고 인정되면 속기ㆍ녹음 또는 녹화를 할 수 있다.<개정 2017. 3. 21.>\n1. 일시 및 장소\n2. 참석위원의 수 및 성명\n3. 그 밖에 참석자 및 배석자의 성명\n4. 상정안건 및 결정사항\n5. 그 밖의 토의사항\n⑦ 위원회의 사무를 지원하기 위하여 위원회에 간사 1명을 두며, 간사는 중앙기록물관리기관의 소속 공무원으로 한다.<개정 2017. 3. 21.>\n⑧ 위원회의 효율적인 운영을 위하여 위원회에 전문위원회나 특별위원회를 둔다.<개정 2017. 3. 21.>\n⑨ 위원회는 제1항 각 호의 사항 중 기술적ㆍ전문적 검토가 필요하거나 그 밖에 전문위원회 또는 특별위원회의 심의가 필요하다고 인정하는 사항에 대하여 그 의결로 전문위원회 또는 특별위원회로 하여금 심의하게 하고 그 결과를 위원회에 보고하게 할 수 있다. 이 경우 전문위원회 또는 특별위원회의 심의는 위원회의 심의로 본다. <신설 2026. 10. 13.>\n⑩ 제1항부터 제9항까지에서 정한 사항 외에 위원회, 전문위원회 및 특별위원회의 구성 및 운영 등에 필요한 사항은 대통령령으로 정한다.<개정 2017. 3. 21., 2026. 10. 13.>","note":"[전문개정 2012. 3. 21.]"}},{"id":"제15조의2","label":"제15조의2","title":"관계 공공기관의 협조","chap":"제3장 국가기록관리위원회","text":"","next":{"eff":"2027-04-14","title":"관계 공공기관의 협조","text":"① 행정안전부장관은 위원회가 제15조제1항 각 호의 사항을 심의하기 위하여 필요하다고 요청하는 경우 관계 공공기관의 장에게 필요한 자료의 제출, 의견 진술 또는 보고를 요청할 수 있다.\n② 제1항에 따른 요청을 받은 공공기관의 장은 특별한 사유가 없으면 이에 협조하여야 한다.","note":"[본조신설 2026. 10. 13.]"},"fresh":1},{"id":"제16조","label":"제16조","title":"기록물 생산의 원칙","chap":"제4장 기록물의 생산","text":"① 공공기관은 효율적이고 책임 있는 업무수행을 위하여 업무의 입안단계부터 종결단계까지 업무수행의 모든 과정 및 결과가 기록물로 생산ㆍ관리될 수 있도록 업무과정에 기반한 기록물관리를 위하여 필요한 조치를 마련하여야 한다.\n② 제1항에 따른 기록물관리를 위하여 필요한 사항은 국회규칙, 대법원규칙, 헌법재판소규칙, 중앙선거관리위원회규칙 및 대통령령으로 정한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제17조","label":"제17조","title":"주요 기록물의 생산의무","chap":"제4장 기록물의 생산","text":"① 공공기관은 주요 정책 또는 사업 등을 추진하는 과정에서 조사ㆍ연구 또는 검토한 내용 및 결과 등을 대통령령으로 정하는 바에 따라 기록물로 생산하여야 한다. <개정 2019. 12. 3.>\n② 공공기관은 대통령령으로 정하는 바에 따라 주요 회의의 회의록, 속기록 또는 녹음기록을 작성하여야 한다. 이 경우 속기록 또는 녹음기록은 그 기록물의 원활한 생산 및 보호를 위하여 대통령령으로 정하는 기간 동안 공개하지 아니할 수 있다.\n③ 공공기관은 주요 업무수행과 관련된 시청각 기록물 등을 대통령령으로 정하는 바에 따라 생산하여야 한다.\n④ 영구기록물관리기관의 장은 주요 기록물 보존을 위하여 관련 기록물을 직접 생산할 필요가 있다고 인정하는 경우에는 관련 공공기관의 장과 협의하여 그 공공기관 또는 행사 등에 소속 공무원을 파견하여 기록물을 생산하게 할 수 있다.<개정 2019. 12. 3.>","note":"[전문개정 2012. 3. 21.] [제목개정 2019. 12. 3.]"},{"id":"제18조","label":"제18조","title":"기록물의 등록ㆍ분류ㆍ편철 등","chap":"제4장 기록물의 생산","text":"공공기관은 업무수행 과정에서 기록물을 생산하거나 접수하였을 때에는 대통령령으로 정하는 바에 따라 그 기록물의 등록ㆍ분류ㆍ편철 등에 필요한 조치를 하여야 한다. 다만, 기록물의 특성상 그 등록ㆍ분류ㆍ편철 등의 방식을 달리 적용할 필요가 있다고 인정되는 수사ㆍ재판 관련 기록물의 경우에는 관계 중앙행정기관의 장이 중앙기록물관리기관의 장과 협의하여 따로 정할 수 있다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제19조","label":"제19조","title":"기록물의 관리 등","chap":"제5장 기록물의 관리","text":"① 공공기관은 대통령령으로 정하는 바에 따라 기록물의 보존기간, 공개 여부, 비밀 여부 및 접근권한 등을 분류하여 관리하여야 한다.\n② 공공기관은 대통령령으로 정하는 기간 이내에 기록물을 관할 기록관 또는 특수기록관으로 이관하여야 한다. 다만, 관할 기록관 또는 특수기록관이 설치되지 아니한 공공기관의 경우에는 대통령령으로 정하는 바에 따라 공공기관의 장이 지정하는 부서로 기록물을 이관하여야 한다.<개정 2017. 3. 21.>\n③ 기록관이나 특수기록관은 보존기간이 30년 이상으로 분류된 기록물을 대통령령으로 정하는 기간 이내에 관할 영구기록물관리기관으로 이관하여야 한다.<개정 2017. 3. 21.>\n④ 정보처리능력을 가진 장치에 의하여 전자적인 형태로 작성하여 송신ㆍ수신 또는 저장되는 기록정보 자료(이하 “전자기록물”이라 한다)로서 대통령령으로 정하는 기록물의 경우에는 해당 기록물의 관리권한만을 관할 기록관, 특수기록관 또는 영구기록물관리기관으로 이전하는 방법으로 기록물을 이관할 수 있다.<신설 2022. 1. 11.>\n⑤ 특수기록관은 제3항에도 불구하고 소관 비공개 기록물의 이관시기를 생산연도 종료 후 30년까지 연장할 수 있으며, 30년이 지난 후에도 업무수행에 사용할 필요가 있는 경우에는 대통령령으로 정하는 바에 따라 중앙기록물관리기관의 장에게 이관시기 연장을 요청할 수 있다.<개정 2022. 1. 11.>\n⑥ 국가정보원장은 제5항에도 불구하고 소관 비공개 기록물의 이관시기를 생산연도 종료 후 50년까지 연장할 수 있으며, 공개될 경우 국가안전보장에 중대한 지장을 줄 것이 예상되는 정보 업무 관련 기록물의 이관시기는 대통령령으로 정하는 바에 따라 중앙기록물관리기관의 장과 협의하여 따로 정할 수 있다.<개정 2022. 1. 11.>\n⑦ 공공기관은 기록물의 원활한 수집 및 이관을 위하여 대통령령으로 정하는 바에 따라 매년 기록물의 생산현황을 관할 기록물관리기관에 통보하여야 한다. 이 경우 중앙행정기관의 소속 기관에 기록관 또는 특수기록관을 설치하였을 때에는 중앙행정기관의 기록관 또는 특수기록관이 그 생산현황을 취합하여 중앙기록물관리기관에 통보하여야 한다.<개정 2017. 3. 21., 2022. 1. 11.>\n⑧ 중앙기록물관리기관의 장은 공공기관 기록물의 관리 상태를 정기적으로 또는 수시로 점검하여야 하며, 필요한 경우 시정 조치를 요구할 수 있다. 다만, 국가정보원의 소관 기록물에 대하여는 국가정보원장과 협의하여 그 방법 및 절차 등을 따로 정할 수 있다.<개정 2019. 12. 3., 2022. 1. 11.>\n⑨ 제8항 본문에 따른 시정 조치의 요구를 받은 공공기관의 장은 특별한 사유가 없으면 이에 따라야 하며, 그 처리 결과를 중앙기록물관리기관의 장에게 통보하여야 한다.<신설 2019. 12. 3., 2022. 1. 11.>","note":"[전문개정 2012. 3. 21.]","next":{"eff":"2027-04-14","title":"기록물의 관리 등","text":"① 공공기관은 대통령령으로 정하는 바에 따라 기록물의 보존 기간ㆍ방법ㆍ장소, 공개 여부, 비밀 여부 및 접근권한 등을 분류하여 관리하여야 한다. <개정 2026. 10. 13.>\n② 공공기관은 대통령령으로 정하는 기간 이내에 기록물을 관할 기록관, 특수기록관 또는 준기록관으로 이관하여야 한다.<개정 2017. 3. 21., 2026. 10. 13.>\n③ 기록관, 특수기록관 또는 준기록관은 보존기간이 영구로 분류된 기록물과 그 밖에 대통령령으로 정하는 기록물을 대통령령으로 정하는 기간 이내에 관할 영구기록물관리기관으로 이관하여야 한다. 다만, 제3조제1호에 따른 대통령령으로 정하는 기관이 생산ㆍ접수한 기록물 또는 관할 영구기록물관리기관의 장이 사료적 가치가 높지 아니하다고 지정한 기록물의 경우에는 관할 영구기록물관리기관의 장과 협의하여 그러하지 아니할 수 있다.<개정 2017. 3. 21., 2026. 10. 13.>\n④ 정보처리능력을 가진 장치에 의하여 전자적인 형태로 작성하여 송신ㆍ수신 또는 저장되는 기록정보 자료(이하 “전자기록물”이라 한다)와 전자기록물이 아닌 기록정보 자료를 정보시스템이 처리할 수 있는 전자적 형태로 변환한 자료로서 대통령령으로 정하는 기록물의 경우에는 관할 영구기록물관리기관의 장과 중앙기록물관리기관의 장이 협의하여 지정한 정보시스템을 활용하여 대통령령으로 정하는 방식과 절차를 따른 경우에는 이관한 것으로 본다.<신설 2022. 1. 11., 2026. 10. 13.>\n⑤ 특수기록관을 설치한 공공기관의 장은 제3항에도 불구하고 소관 비공개 기록물의 이관시기를 생산연도 종료 후 30년까지 연장할 수 있으며, 30년이 지난 후에도 업무수행에 사용할 필요가 있는 경우에는 대통령령으로 정하는 바에 따라 중앙기록물관리기관의 장에게 이관시기 연장을 요청할 수 있다.<개정 2022. 1. 11., 2026. 10. 13.>\n⑥ 국가정보원장은 제5항에도 불구하고 소관 비공개 기록물의 이관시기를 생산연도 종료 후 50년까지 연장할 수 있으며, 공개될 경우 국가안전보장에 중대한 지장을 줄 것이 예상되는 정보 업무 관련 기록물의 이관시기는 대통령령으로 정하는 바에 따라 중앙기록물관리기관의 장과 협의하여 따로 정할 수 있다.<개정 2022. 1. 11.>\n⑦ 공공기관은 기록물의 원활한 수집 및 이관을 위하여 대통령령으로 정하는 바에 따라 매년 기록물의 생산현황을 관할 기록물관리기관에 통보하여야 한다. 이 경우 중앙행정기관의 소속 기관에 기록관 또는 특수기록관을 설치하였을 때에는 중앙행정기관의 기록관 또는 특수기록관이 그 생산현황을 취합하여 중앙기록물관리기관에 통보하여야 한다.<개정 2017. 3. 21., 2022. 1. 11.>\n⑧ 중앙기록물관리기관의 장은 공공기관 기록물의 관리 상태를 정기적으로 또는 수시로 점검하여야 하며, 필요한 경우 시정 조치를 요구할 수 있다. 다만, 국가정보원의 소관 기록물에 대하여는 국가정보원장과 협의하여 그 방법 및 절차 등을 따로 정할 수 있다.<개정 2019. 12. 3., 2022. 1. 11.>\n⑨ 제8항 본문에 따른 시정 조치의 요구를 받은 공공기관의 장은 특별한 사유가 없으면 이에 따라야 하며, 그 처리 결과를 중앙기록물관리기관의 장에게 통보하여야 한다.<신설 2019. 12. 3., 2022. 1. 11.>","note":"[전문개정 2012. 3. 21.]"}},{"id":"제19조의2","label":"제19조의2","title":"기록물의 무단 은닉 등의 금지","chap":"제5장 기록물의 관리","text":"누구든지 기록물을 무단으로 손상ㆍ은닉ㆍ멸실 또는 유출하거나 국외로 반출해서는 아니 된다.","note":"[본조신설 2019. 12. 3.]"},{"id":"제20조","label":"제20조","title":"전자기록물의 관리","chap":"제5장 기록물의 관리","text":"① 중앙기록물관리기관의 장은 전자기록물의 안전하고 체계적인 관리 및 활용 등을 위하여 다음 각 호의 사항을 포함하는 전자기록물 관리체계를 구축ㆍ운영하여야 한다. <개정 2019. 12. 3., 2022. 1. 11.>\n1. 전자기록물 관리시스템의 기능ㆍ규격ㆍ관리항목ㆍ보존포맷(기록물 보존을 위한 파일형식을 말한다) 및 매체 등 관리 표준화에 관한 사항\n2. 기록물관리기관의 전자기록물 데이터 공유 및 통합 검색ㆍ활용에 관한 사항\n3. 전자기록물의 진본성 유지를 위한 데이터 관리체계에 관한 사항\n4. 행정전자서명 등 인증기록의 보존ㆍ활용 등에 관한 사항\n5. 기록물관리기관 간 기록물의 전자적 연계ㆍ활용 체계 구축에 관한 사항\n6. 전자기록물의 생산포맷(기록물 생산을 위한 파일형식을 말한다) 및 소프트웨어 등에 관한 기술정보의 수집ㆍ활용에 관한 사항\n② 전자기록물과 전자적으로 생산되지 아니한 기록물의 전자적 관리를 위하여 그 밖에 필요한 사항은 대통령령으로 정한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제20조의2","label":"제20조의2","title":"전자기록물 기술정보의 관리","chap":"제5장 기록물의 관리","text":"① 공공기관의 장은 제20조제1항제6호에 따른 전자기록물의 기술정보를 대통령령으로 정하는 바에 따라 관리하고 중앙기록물관리기관에 제출하여야 한다.\n② 중앙기록물관리기관의 장은 전자기록물을 장기간 보존하고 활용할 수 있도록 제1항에 따른 기술정보의 관리기준과 수집ㆍ활용 등에 관한 대책을 마련하여야 한다.","note":"[본조신설 2019. 12. 3.]"},{"id":"제21조","label":"제21조","title":"중요 기록물의 이중보존","chap":"제5장 기록물의 관리","text":"① 영구보존으로 분류된 기록물 중 중요한 기록물은 복제본을 제작하여 보존하거나 보존매체에 수록하는 등의 방법으로 이중보존하는 것을 원칙으로 한다.\n② 기록물관리기관이 보존하는 기록물 중 보존매체에 수록된 중요 기록물은 안전한 분산 보존을 위하여 대통령령으로 정하는 바에 따라 그 기록물의 보존매체 사본을 중앙기록물관리기관에 송부하여야 한다.\n③ 중앙기록물관리기관의 장은 국가적으로 보존할 가치가 있는 기록물에 대하여는 기록물관리기관에 그 기록물을 보존매체에 수록하고 보존매체 사본을 송부하여 줄 것을 요청할 수 있다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제22조","label":"제22조","title":"간행물의 관리","chap":"제5장 기록물의 관리","text":"① 공공기관은 간행물을 발간하려면 대통령령으로 정하는 바에 따라 관할 영구기록물관리기관으로부터 발간등록번호를 부여받아야 한다. <개정 2017. 3. 21.>\n② 공공기관은 발간하는 간행물에 제1항에 따른 발간등록번호를 표기하여야 하며, 간행물을 발간하였을 때에는 지체 없이 그 간행물 3부를 각각 관할 기록관 또는 특수기록관과 관할 영구기록물관리기관 및 중앙기록물관리기관에 송부하여 보존ㆍ활용되도록 하여야 한다.<개정 2017. 3. 21.>","note":"[전문개정 2012. 3. 21.]"},{"id":"제23조","label":"제23조","title":"시청각 기록물의 관리","chap":"제5장 기록물의 관리","text":"공공기관은 업무수행과 관련하여 생산한 사진, 필름, 테이프, 비디오, 음반, 디스크 등 영상 또는 음성 형태의 기록물을 대통령령으로 정하는 바에 따라 관리하고 관할 영구기록물관리기관으로 이관하여야 한다. <개정 2017. 3. 21.>","note":"[전문개정 2012. 3. 21.]"},{"id":"제24조","label":"제24조","title":"행정박물의 관리","chap":"제5장 기록물의 관리","text":"공공기관은 업무수행과 관련하여 생산ㆍ활용한 형상기록물로서 행정적ㆍ역사적ㆍ문화적ㆍ예술적 가치가 높은 기록물을 대통령령으로 정하는 바에 따라 관리하고 관할 영구기록물관리기관으로 이관하여야 한다. <개정 2017. 3. 21.>","note":"[전문개정 2012. 3. 21.]"},{"id":"제25조","label":"제25조","title":"폐지기관의 기록물관리","chap":"제5장 기록물의 관리","text":"① 공공기관이 폐지된 경우 그 사무를 승계하는 기관이 없을 때에는 폐지되는 공공기관의 장은 지체 없이 그 기관의 기록물을 관할 영구기록물관리기관으로 이관하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우의 기록물은 대통령령으로 정하는 바에 따라 이관하여야 한다. <개정 2017. 3. 21.>\n1. 국가 또는 지방자치단체의 기관이 제3조제1호에 따른 대통령령으로 정하는 기관 또는 민간기관으로 전환되는 경우\n2. 제3조제1호에 따른 대통령령으로 정하는 기관이 민간기관으로 전환되는 경우\n② 공공기관이 폐지된 경우에 그 사무를 승계하는 기관이 있을 때에는 폐지되는 기관의 장과 그 사무를 승계하는 기관의 장은 대통령령으로 정하는 바에 따라 기록물 인수인계가 원활하게 이루어질 수 있도록 조치하여야 한다.\n③ 영구기록물관리기관의 장은 폐지되는 기관의 소관 기록물의 체계적인 이관 및 관리 등을 위하여 필요한 경우에는 소속 공무원을 파견할 수 있다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제26조","label":"제26조","title":"기록물의 회수","chap":"제5장 기록물의 관리","text":"① 공공기관의 장 및 영구기록물관리기관의 장은 기록물이 유출되어 민간인이 이를 소유하거나 관리하는 경우에는 그 기록물을 회수하거나 위탁보존 또는 복제본 수집 등 필요한 조치를 하여야 한다. 이 경우 기록물을 회수하였을 때에는 선의로 취득한 제3자에게 대통령령으로 정하는 기준에 따라 필요한 보상을 할 수 있다.\n② 공공기관(국가기관과 지방자치단체만 해당한다)의 장 및 영구기록물관리기관의 장은 제1항에 따른 기록물의 회수를 위하여 필요하다고 인정하면 관계 공무원으로 하여금 민간인이 소유하거나 관리하는 기록물의 목록 및 내용의 확인, 그 밖에 필요한 조사를 하게 할 수 있다.\n③ 제2항에 따라 조사를 하는 공무원은 그 권한을 표시하는 증표를 관계인에게 보여주어야 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제27조","label":"제27조","title":"기록물의 폐기","chap":"제5장 기록물의 관리","text":"① 공공기관이 기록물을 폐기하려는 경우에는 대통령령으로 정하는 바에 따라 제41조제1항에 따른 기록물관리 전문요원의 심사와 제27조의2에 따른 기록물평가심의회의 심의를 거쳐야 한다.\n② 영구기록물관리기관이 보존 중인 기록물의 보존가치를 재분류하여 폐기하려는 경우에는 대통령령으로 정하는 기준과 절차를 준수하여야 한다.\n③ 제1항의 기록물 폐기의 시행은 민간 등에 위탁할 수 있다. 이 경우 기록물의 폐기가 종료될 때까지 관계 공무원이 참석하여 감독하는 등 기록물이 유출되지 아니하도록 필요한 조치를 하여야 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제27조의2","label":"제27조의2","title":"기록물평가심의회","chap":"제5장 기록물의 관리","text":"① 공공기관의 장 및 영구기록물관리기관의 장은 보존 중인 기록물의 평가 및 폐기를 위하여 민간전문가를 포함한 기록물평가심의회를 구성ㆍ운영하여야 한다.\n② 기록물평가심의회의 구성ㆍ운영 등에 필요한 사항은 국회규칙, 대법원규칙, 헌법재판소규칙, 중앙선거관리위원회규칙 및 대통령령으로 정한다.","note":"[본조신설 2012. 3. 21.]"},{"id":"제27조의3","label":"제27조의3","title":"기록물의 폐기 금지","chap":"제5장 기록물의 관리","text":"① 중앙기록물관리기관의 장은 제27조에도 불구하고 국가적으로 중대한 사안으로서 조사기관 또는 수사기관의 요청이 있거나 국민의 권익보호를 위하여 긴급히 필요한 경우 등 대통령령으로 정하는 경우에는 기록물의 폐기 금지를 결정하고 해당 공공기관 및 영구기록물관리기관에 통보할 수 있다. 다만, 헌법기관기록물관리기관의 소관 기록물에 대해서는 미리 그 기관의 장과 협의하여야 한다.\n② 제1항에 따라 폐기 금지를 통보받은 공공기관 및 영구기록물관리기관의 장은 해당 기록물이 폐기되지 아니하도록 조치하고 대통령령으로 정하는 바에 따라 관리하여야 한다.\n③ 중앙기록물관리기관의 장은 제2항에 따른 기록물의 폐기 금지 조치 및 관리실태 등을 확인하기 위하여 해당 공공기관 및 영구기록물관리기관에 대한 기록물관리 현황조사 또는 점검 등을 실시하고 필요한 경우 시정 조치를 할 수 있다.\n④ 기록물의 폐기 금지 조치 및 관리 등에 관하여 필요한 사항은 대통령령으로 정한다.","note":"[본조신설 2019. 12. 3.]"},{"id":"제28조","label":"제28조","title":"기록물관리기관의 시설ㆍ장비","chap":"제5장 기록물의 관리","text":"① 중앙기록물관리기관의 장은 기록물의 체계적 관리, 안전한 보존 및 효율적 활용을 위하여 대통령령으로 정하는 바에 따라 기록물관리기관별 시설ㆍ장비 기준을 정하여야 한다.\n② 기록물관리기관의 장은 제1항에 따른 시설ㆍ장비 기준을 준수하여야 하며, 이를 준수하지 아니하는 기록물관리기관에 대하여는 중앙기록물관리기관의 장이 그 시정을 요구할 수 있다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제29조","label":"제29조","title":"기록매체 및 용품 등","chap":"제5장 기록물의 관리","text":"① 기록물관리기관이 기록물을 마이크로필름 또는 전자매체에 수록하여 관리할 때에는 중앙기록물관리기관과 상호 유통 및 활용이 가능하도록 중앙기록물관리기관에서 정하는 기준에 따라 관리하여야 한다.\n② 중앙기록물관리기관의 장은 기록물관리에 사용되는 기록매체ㆍ재료 등에 관하여 보존에 적합한 규격을 정하여야 하며, 그 규격의 제정ㆍ관리 및 인증 등에 필요한 사항은 대통령령으로 정한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제30조","label":"제30조","title":"기록물 보안 및 재난 대책","chap":"제5장 기록물의 관리","text":"① 기록물관리기관의 장은 소관 기록물의 안전한 관리를 위하여 대통령령으로 정하는 바에 따라 기록물에 대한 보안 및 재난 대책을 수립ㆍ시행하여야 한다.\n② 영구기록물관리기관의 장은 전자기록물의 안전한 관리를 위하여 재난대비 복구체계를 구축ㆍ운영하여야 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제30조의2","label":"제30조의2","title":"보존ㆍ복원 기술의 연구ㆍ개발","chap":"제5장 기록물의 관리","text":"중앙기록물관리기관의 장은 기록물의 과학적이고 체계적인 보존 및 복원 기술의 개발과 개발된 기술의 확산을 위하여 노력하여야 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제30조의3","label":"제30조의3","title":"기록물의 부기 또는 정정","chap":"제5장 기록물의 관리","text":"기록물관리기관의 장은 다음 각 호의 어느 하나에 해당하는 경우로서 공공기관의 장으로부터 소관 기록물의 부기 또는 정정을 요청받은 경우에는 대통령령으로 정하는 바에 따라 그 내용을 부기 또는 정정할 수 있다.\n1. 「가족관계의 등록 등에 관한 법률」 제18조, 제99조, 제100조, 제104조, 제105조 또는 제107조에 따라 가족관계등록부가 정정되는 경우\n2. 「사면법」 제25조에 따라 판결원본에 그 사유를 덧붙여야 할 경우\n3. 「주민등록법」 제7조의3 또는 제7조의4에 따라 주민등록번호가 정정 또는 변경되는 경우\n4. 그 밖에 제1호부터 제3호까지의 규정과 유사한 경우로서 대통령령으로 정하는 경우","note":"[본조신설 2022. 1. 11.]"},{"id":"제31조","label":"제31조","title":"삭제","chap":"제6장 삭제","text":"삭제 <2007. 4. 27.>"},{"id":"제32조","label":"제32조","title":"비밀 기록물 관리의 원칙","chap":"제7장 비밀 기록물의 관리","text":"기록물관리기관의 장은 대통령령으로 정하는 바에 따라 비밀 기록물 관리에 필요한 별도의 전용서고 등 비밀 기록물 관리체계를 갖추고 전담 관리요원을 지정하여야 하며, 비밀 기록물 취급 과정에서 비밀이 누설되지 아니하도록 보안대책을 수립ㆍ시행하여야 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제33조","label":"제33조","title":"비밀 기록물의 관리","chap":"제7장 비밀 기록물의 관리","text":"① 공공기관은 비밀 기록물을 생산할 때에는 그 기록물의 원본에 비밀 보호기간 및 보존기간을 함께 정하여 보존기간이 끝날 때까지 관리되도록 하여야 한다. 이 경우 보존기간은 비밀 보호기간 이상의 기간으로 책정하여야 한다.\n② 비밀 기록물의 원본은 대통령령으로 정하는 바에 따라 관할 기록물관리기관으로 이관하여 보존하여야 한다. <개정 2017. 3. 21.>","note":"[전문개정 2012. 3. 21.]"},{"id":"제34조","label":"제34조","title":"비밀 기록물 생산현황 등 통보","chap":"제7장 비밀 기록물의 관리","text":"공공기관의 장은 해당 기관이 생산한 비밀 기록물 원본에 대하여 대통령령으로 정하는 바에 따라 매년 그 생산ㆍ해제 및 재분류 현황을 관할 영구기록물관리기관의 장에게 통보하여야 한다. 이 경우 통보서식 등은 행정안전부령으로 정하되, 미리 국가정보원장과 협의하여야 한다. <개정 2013. 3. 23., 2014. 11. 19., 2017. 3. 21., 2017. 7. 26.>","note":"[전문개정 2012. 3. 21.]"},{"id":"제35조","label":"제35조","title":"기록물의 공개 여부 분류","chap":"제8장 기록물의 공개ㆍ열람 및 활용","text":"① 공공기관은 관할 기록물관리기관으로 기록물을 이관하려는 경우에는 그 기록물의 공개 여부를 재분류하여 이관하여야 한다. 다만, 공공기관의 기록관 또는 특수기록관이 영구기록물관리기관으로 기록물을 이관하는 경우로서 제2항에 따라 기록물을 이관하기 전 최근 5년의 기간 중 해당 기록물의 공개 여부를 재분류한 경우에는 공개 여부 재분류 절차를 생략하고 기록물을 이관할 수 있다. <개정 2017. 3. 21.>\n② 기록물관리기관은 비공개로 재분류된 기록물에 대해서는 재분류된 연도의 다음 연도부터 5년마다 공개 여부를 재분류하여야 한다. 다만, 기록물관리기관이 「공공기관의 정보공개에 관한 법률」 제9조제1항제6호에 해당하여 비공개로 재분류한 기록물에 대해서는 생산연도 종료 후 30년까지 공개여부 재분류를 실시하지 아니할 수 있다.<개정 2019. 12. 3.>\n③ 비공개 기록물은 생산연도 종료 후 30년이 지나면 모두 공개하는 것을 원칙으로 한다. 다만, 제19조제5항 및 제6항에 따라 이관시기가 30년 이상으로 연장되는 기록물의 경우에는 그러하지 아니하다.<개정 2022. 1. 11.>\n④ 영구기록물관리기관의 장은 기록물 생산기관으로부터 기록물 비공개 기간의 연장 요청을 받으면 제3항 본문에도 불구하고 제38조에 따른 기록물공개심의회 및 위원회의 심의를 각각 거쳐 해당 기록물을 공개하지 아니할 수 있다. 이 경우 비공개로 재분류된 기록물에 대하여는 비공개 유형별 현황을 관보와 인터넷 홈페이지 등에 공고하여야 하고, 재분류된 연도의 다음 연도부터 5년마다 공개 여부를 재분류하여야 한다.<개정 2019. 12. 3.>\n⑤ 기록물관리기관의 장은 통일ㆍ외교ㆍ안보ㆍ수사ㆍ정보 분야의 기록물을 공개하려면 미리 그 기록물을 생산한 기관의 장의 의견을 들어야 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제36조","label":"제36조","title":"영구기록물관리기관 보존기록물의 비공개 상한기간 지정","chap":"제8장 기록물의 공개ㆍ열람 및 활용","text":"중앙기록물관리기관의 장은 영구기록물관리기관으로 이관된 기록물에 대하여는 대통령령으로 정하는 바에 따라 기록물의 성격별로 비공개 상한기간을 따로 정할 수 있다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제37조","label":"제37조","title":"비공개 기록물의 열람","chap":"제8장 기록물의 공개ㆍ열람 및 활용","text":"① 영구기록물관리기관의 장은 해당 기관이 관리하고 있는 비공개 기록물에 대하여 다음 각 호의 어느 하나에 해당하는 열람 청구를 받으면 대통령령으로 정하는 바에 따라 이를 제한적으로 열람하게 할 수 있다.\n1. 개인에 관한 정보로서 본인(상속인을 포함한다) 또는 본인의 위임을 받은 대리인이 열람을 청구한 경우\n2. 개인이나 단체가 권리구제 등을 위하여 열람을 청구한 경우로서 해당 기록물이 아니면 관련 정보의 확인이 불가능하다고 인정되는 경우\n3. 공공기관에서 직무수행상 필요에 따라 열람을 청구한 경우로서 해당 기록물이 아니면 관련 정보의 확인이 불가능하다고 인정되는 경우\n4. 개인이나 단체가 학술연구 등 비영리 목적으로 열람을 청구한 경우로서 해당 기록물이 아니면 관련 정보의 확인이 불가능하다고 인정되는 경우\n② 제1항에 따라 비공개 기록물을 열람한 자는 그 기록물에 관한 정보를 열람신청서에 적은 목적 외의 용도로 사용할 수 없다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제38조","label":"제38조","title":"기록물공개심의회","chap":"제8장 기록물의 공개ㆍ열람 및 활용","text":"① 영구기록물관리기관은 다음 각 호의 사항을 심의하기 위하여 기록물공개심의회를 설치ㆍ운영하여야 한다.\n1. 제35조제4항에 따른 비공개 기간 연장 요청에 관한 사항\n2. 그 밖에 기록물 공개 여부와 관련하여 영구기록물관리기관의 장이 심의를 요청한 사항\n② 기록물공개심의회는 위원장 1명을 포함하여 7명의 위원으로 구성하고, 위원장과 위원의 임기는 2년으로 하며, 연임할 수 있다.\n③ 기록물공개심의회의 위원은 소속 공무원 및 기록물의 공개와 관련된 지식과 경험이 풍부한 사람 중에서 영구기록물관리기관의 장이 임명하거나 위촉하며, 그 구성과 운영에 관한 사항은 대통령령으로 정한다.\n④ 기록물공개심의회의 회의록 작성ㆍ보존에 관하여는 제15조제6항을 준용한다.<개정 2017. 3. 21.>","note":"[전문개정 2012. 3. 21.]","next":{"eff":"2027-04-14","title":"기록물공개심의회","text":"① 영구기록물관리기관은 다음 각 호의 사항을 심의하기 위하여 기록물공개심의회를 설치ㆍ운영하여야 한다.\n1. 제35조제4항에 따른 비공개 기간 연장 요청에 관한 사항\n2. 그 밖에 기록물 공개 여부와 관련하여 영구기록물관리기관의 장이 심의를 요청한 사항\n② 기록물공개심의회는 위원장 1명을 포함하여 7명 이상 15명 이하의 위원으로 구성하고, 위원장과 위원의 임기는 3년으로 하며, 연임할 수 있다.<개정 2026. 10. 13.>\n③ 기록물공개심의회의 위원은 업무를 공정하고 독립적으로 수행할 수 있다고 인정되는 사람으로서 소속 공무원 및 기록물의 공개와 관련된 지식과 경험이 풍부한 사람 중에서 영구기록물관리기관의 장이 임명하거나 위촉하며, 그 구성과 운영에 관한 사항은 대통령령으로 정한다. 이 경우 위원 중 3분의 2 이상을 공무원이 아닌 사람으로 위촉한다.<개정 2026. 10. 13.>\n④ 기록물공개심의회의 회의록 작성ㆍ보존에 관하여는 제15조제6항을 준용한다.<개정 2017. 3. 21.>","note":"[전문개정 2012. 3. 21.]"}},{"id":"제38조의2","label":"제38조의2","title":"영구기록물관리기관 보존기록물의 활용","chap":"제8장 기록물의 공개ㆍ열람 및 활용","text":"영구기록물관리기관의 장은 그 기관이 보존하고 있는 기록물의 공개 및 열람 편의를 제공하기 위하여 기록물을 정리(整理)ㆍ기술(記述)ㆍ편찬하고, 콘텐츠를 구축하는 등의 사업을 추진하여야 한다.","note":"[본조신설 2010. 2. 4.]"},{"id":"제39조","label":"제39조","title":"기록물관리의 표준화","chap":"제9장 기록물관리의 표준화 및 전문화","text":"중앙기록물관리기관의 장은 기록물의 체계적ㆍ전문적 관리 및 효율적 활용을 위하여 다음의 사항에 대한 표준을 제정ㆍ시행하여야 한다. 다만, 기록물관리 표준과 관련된 사항이 「산업표준화법」에 따른 한국산업표준으로 제정되어 있는 경우에는 그러하지 아니하다.\n1. 전자기록물의 관리체계 및 관리항목\n2. 기록물관리 절차별 표준기능\n3. 기록물 종류별 관리 기준 및 절차\n4. 기록물관리기관의 유형별 표준모델\n5. 기록물 보안 및 재난관리 대책\n6. 그 밖에 기록물의 효율적 관리를 위하여 필요한 사항","note":"[전문개정 2012. 3. 21.]"},{"id":"제40조","label":"제40조","title":"기록물관리 표준의 제정절차 등","chap":"제9장 기록물관리의 표준화 및 전문화","text":"① 중앙기록물관리기관의 장은 제39조에 따른 기록물관리 표준을 제정ㆍ개정 또는 폐지하려면 대통령령으로 정하는 바에 따라 그 내용을 관보 등에 고시하여 이해관계인의 의견을 들어야 한다.\n② 중앙기록물관리기관의 장은 기록물관리 표준의 확대ㆍ보급을 위하여 지도ㆍ교육 등 필요한 조치를 하여야 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제41조","label":"제41조","title":"기록물관리 전문요원","chap":"제9장 기록물관리의 표준화 및 전문화","text":"① 체계적ㆍ전문적인 기록물관리를 위하여 기록물관리기관에는 기록물관리 전문요원을 배치하여야 한다.\n② 기록물관리 전문요원의 자격 및 배치인원 등에 관하여 필요한 사항은 국회규칙, 대법원규칙, 헌법재판소규칙, 중앙선거관리위원회규칙 및 대통령령으로 정한다.\n③ 중앙기록물관리기관의 장은 기록물관리 전문요원을 포함한 전문인력의 수요 파악 및 양성 등에 관한 계획을 수립하여야 한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제42조","label":"제42조","title":"기록물관리 교육ㆍ훈련","chap":"제9장 기록물관리의 표준화 및 전문화","text":"중앙기록물관리기관의 장은 대통령령으로 정하는 바에 따라 기록물관리에 관한 교육ㆍ훈련 대책을 수립ㆍ시행하여야 한다. <개정 2022. 1. 11.>","note":"[전문개정 2012. 3. 21.]"},{"id":"제43조","label":"제43조","title":"국가지정기록물의 지정 및 해제","chap":"제10장 민간기록물 등의 수집ㆍ관리","text":"① 중앙기록물관리기관의 장은 개인이나 단체가 생산ㆍ취득한 기록정보 자료 등(이하 “민간기록물”이라 한다)으로서 국가적으로 영구히 보존할 가치가 있다고 인정되는 민간기록물을 위원회의 심의를 거쳐 국가지정기록물로 지정하여 관리할 수 있다.\n② 민간기록물을 소유하거나 관리하는 자는 중앙기록물관리기관의 장에게 그 민간기록물을 국가지정기록물로 지정하여 줄 것을 신청할 수 있다.\n③ 중앙기록물관리기관의 장은 제1항에 따른 국가지정기록물의 지정을 위하여 필요하다고 인정하면 소속 공무원으로 하여금 관련 민간기록물의 목록 및 내용의 확인, 그 밖에 필요한 조사를 하게 할 수 있다.\n④ 제3항에 따른 조사의 경우에는 제26조제3항을 준용한다.\n⑤ 중앙기록물관리기관의 장은 제1항에 따라 민간기록물을 국가지정기록물로 지정한 경우에는 이를 소유하거나 관리하는 자에게 지정사실을 통보하여야 한다.\n⑥ 중앙기록물관리기관의 장은 제1항에 따라 지정된 기록물이 국가지정기록물로서의 보존가치를 잃었다고 판단하는 경우나 국가지정기록물의 소유자 또는 관리자의 신청이 있는 경우에는 위원회의 심의를 거쳐 이를 해제할 수 있다.","note":"[전문개정 2012. 3. 21.]","next":{"eff":"2027-04-14","title":"국가지정기록물의 지정 및 해제","text":"① 행정안전부장관은 민간기록물 중 국가적으로 영구히 보존할 가치가 있다고 인정되는 것을 위원회의 심의를 거쳐 국가지정기록물로 지정하여 관리할 수 있다. <개정 2026. 10. 13.>\n② 민간기록물을 소유하거나 관리하는 자는 행정안전부장관에게 그 민간기록물을 국가지정기록물로 지정하여 줄 것을 신청할 수 있다.<개정 2026. 10. 13.>\n③ 행정안전부장관은 제1항에 따른 국가지정기록물의 지정을 위하여 필요하다고 인정하면 소속 공무원으로 하여금 관련 민간기록물의 목록 및 내용의 확인, 그 밖에 필요한 조사를 하게 할 수 있다.<개정 2026. 10. 13.>\n④ 제3항에 따른 조사의 경우에는 제26조제3항을 준용한다.\n⑤ 행정안전부장관은 제1항에 따라 민간기록물을 국가지정기록물로 지정한 경우에는 이를 소유하거나 관리하는 자에게 지정사실을 통보하여야 한다. 이 경우 증서 등을 함께 교부할 수 있다.<개정 2026. 10. 13.>\n⑥ 행정안전부장관은 제1항에 따라 지정된 기록물이 국가지정기록물로서의 보존가치를 잃었다고 판단하는 경우나 국가지정기록물의 소유자 또는 관리자의 신청이 있는 경우에는 위원회의 심의를 거쳐 이를 해제할 수 있다. <개정 2026. 10. 13.>\n⑦ 행정안전부장관은 국가지정기록물로 지정할 만한 민간기록물의 적극적인 발굴을 위하여 대통령령으로 정하는 바에 따라 민간기록물에 관한 전문지식과 경험이 풍부한 사람을 포함하여 국가지정기록물 추천위원회를 구성ㆍ운영할 수 있다.<신설 2026. 10. 13.>\n⑧ 제1항부터 제7항까지에서 규정한 사항 외에 국가지정기록물의 지정 및 해제에 필요한 사항은 대통령령으로 정한다.<신설 2026. 10. 13.>","note":"[전문개정 2012. 3. 21.]"}},{"id":"제44조","label":"제44조","title":"국가지정기록물의 변동사항 관리","chap":"제10장 민간기록물 등의 수집ㆍ관리","text":"제43조제1항에 따라 지정된 국가지정기록물의 소유자 또는 관리자는 그 국가지정기록물에 관하여 다음 각 호의 어느 하나에 해당하는 변동사항이 발생한 경우에는 대통령령으로 정하는 바에 따라 그 사실을 중앙기록물관리기관의 장에게 신고하여야 한다.\n1. 국가지정기록물의 처분ㆍ증여 또는 양도 등으로 소유자가 변경된 경우\n2. 소유자가 관리자를 선임하거나 해임한 경우\n3. 소유자나 관리자의 성명ㆍ주소(단체의 경우에는 그 명칭 및 주된 사무소의 소재지를 말한다) 및 보관 장소가 변경된 경우\n4. 국가지정기록물이 멸실ㆍ도난 또는 훼손된 경우","note":"[전문개정 2012. 3. 21.]","next":{"eff":"2027-04-14","title":"국가지정기록물의 변동사항 관리","text":"제43조제1항에 따라 지정된 국가지정기록물의 소유자 또는 관리자는 그 국가지정기록물에 관하여 다음 각 호의 어느 하나에 해당하는 변동사항이 발생한 경우에는 대통령령으로 정하는 바에 따라 그 사실을 행정안전부장관에게 신고하여야 한다. <개정 2026. 10. 13.>\n1. 국가지정기록물의 처분ㆍ증여 또는 양도 등으로 소유자가 변경된 경우\n2. 소유자가 관리자를 선임하거나 해임한 경우\n3. 소유자나 관리자의 성명ㆍ주소(단체의 경우에는 그 명칭 및 주된 사무소의 소재지를 말한다) 및 보관 장소가 변경된 경우\n4. 국가지정기록물이 멸실ㆍ도난 또는 훼손된 경우","note":"[전문개정 2012. 3. 21.]"}},{"id":"제45조","label":"제45조","title":"국가지정기록물의 보존ㆍ관리","chap":"제10장 민간기록물 등의 수집ㆍ관리","text":"① 중앙기록물관리기관의 장은 국가지정기록물 보호를 위하여 필요한 경우에는 국가지정기록물의 소유자 또는 관리자에게 필요한 보존시설을 설치하도록 요청할 수 있다. 이 경우 보존시설 설치 등에 드는 비용은 예산의 범위에서 지원할 수 있다.\n② 중앙기록물관리기관의 장은 국가지정기록물의 소유자 또는 관리자가 제1항에 따른 보존시설을 설치할 수 없는 부득이한 사유가 있는 경우에는 그 소유자 또는 관리자로부터 관리를 위탁받아 보존할 수 있다.\n③ 중앙기록물관리기관의 장은 국가지정기록물을 복제하거나 사본을 제작할 필요가 있는 경우에는 그 국가지정기록물의 소유자 또는 관리자에게 이에 관한 협조를 요청할 수 있으며, 그 소유자 또는 관리자는 특별한 사유가 없으면 협조하여야 한다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 국가지정기록물의 보존ㆍ관리에 필요한 사항은 대통령령으로 정한다.","note":"[전문개정 2012. 3. 21.]","next":{"eff":"2027-04-14","title":"국가지정기록물의 보존ㆍ관리","text":"① 행정안전부장관은 국가지정기록물 보호를 위하여 필요한 경우에는 국가지정기록물의 소유자 또는 관리자에게 필요한 보존시설을 설치하도록 요청할 수 있다. 이 경우 보존시설 설치 등에 드는 비용은 예산의 범위에서 지원할 수 있다. <개정 2026. 10. 13.>\n② 행정안전부장관은 국가지정기록물의 소유자 또는 관리자가 제1항에 따른 보존시설을 설치할 수 없는 부득이한 사유가 있는 경우에는 그 소유자 또는 관리자로부터 관리를 위탁받아 보존할 수 있다.<개정 2026. 10. 13.>\n③ 행정안전부장관은 국가지정기록물을 복제하거나 사본을 제작할 필요가 있는 경우에는 그 국가지정기록물의 소유자 또는 관리자에게 이에 관한 협조를 요청할 수 있으며, 그 소유자 또는 관리자는 특별한 사유가 없으면 협조하여야 한다.<개정 2026. 10. 13.>\n④ 제1항부터 제3항까지에서 규정한 사항 외에 국가지정기록물의 보존ㆍ관리에 필요한 사항은 대통령령으로 정한다.","note":"[전문개정 2012. 3. 21.]"}},{"id":"제45조의2","label":"제45조의2","title":"지방자치단체지정기록물","chap":"제10장 민간기록물 등의 수집ㆍ관리","text":"","next":{"eff":"2027-04-14","title":"지방자치단체지정기록물","text":"① 지방자치단체의 장은 보존가치가 높다고 인정되는 민간기록물을 지방자치단체지정기록물 심의위원회의 심의를 거쳐 지방자치단체지정기록물로 지정하여 관리할 수 있다.\n② 지방자치단체지정기록물의 지정ㆍ해제, 변동사항 관리 및 보존ㆍ관리에 관하여는 제43조부터 제45조까지를 준용한다. 이 경우 “국가지정기록물”은 “지방자치단체지정기록물”로, “행정안전부장관”은 “지방자치단체의 장”으로, “위원회”는 “지방자치단체지정기록물 심의위원회”로, “국가지정기록물 추천위원회”는 “지방자치단체지정기록물 추천위원회”로, “대통령령”은 “조례”로 본다.\n③ 지방자치단체지정기록물 심의위원회 및 지방자치단체지정기록물 추천위원회의 구성ㆍ운영 등에 필요한 사항은 조례로 정한다.","note":"[본조신설 2026. 10. 13.]"},"fresh":1},{"id":"제46조","label":"제46조","title":"주요 기록정보 자료 등의 수집","chap":"제10장 민간기록물 등의 수집ㆍ관리","text":"① 중앙기록물관리기관의 장은 국가적으로 보존가치가 높은 국내외 소재 주요 기록정보 자료와 민간기록물을 수집할 수 있다.\n② 중앙기록물관리기관의 장은 국가적으로 보존가치가 높은 국내외 소재 주요 기록정보 자료와 민간기록물의 소유자 또는 관리자에게 그 기록정보 자료 또는 민간기록물의 목록이나 그 사본의 제출을 요청할 수 있다. 이 경우 그 기록정보 자료 또는 민간기록물의 소유자 또는 관리자는 특별한 사유가 없으면 협조하여야 한다.\n③ 중앙기록물관리기관의 장은 「영화 및 비디오물의 진흥에 관한 법률」 제29조제1항에 따라 상영등급을 분류받은 영화 중에서 국가적으로 영구히 보존할 가치가 있다고 판단하여 문화체육관광부장관과 협의하여 지정하는 영화에 대하여는 그 영화의 소유자 또는 관리자에게 원판필름 또는 그 복사본 1벌과 대본 1부를 송부하여 줄 것을 요청할 수 있다.\n④ 중앙기록물관리기관의 장은 방송(재송신은 제외한다)된 프로그램 중에서 국가적으로 영구히 보존할 가치가 있다고 판단되는 방송프로그램에 대하여는 방송미디어통신위원회와 협의하여 수집대상 방송프로그램으로 지정할 수 있다. 이 경우 중앙기록물관리기관의 장은 「방송법」 제2조제3호가목에 따른 지상파방송사업자에게 해당 방송프로그램의 원본 또는 사본 1부를 송부하여 줄 것을 요청할 수 있다.<개정 2013. 3. 23., 2017. 7. 26., 2025. 10. 1.>\n⑤ 제1항부터 제4항까지의 규정에 따른 기록정보 자료 및 민간기록물 등의 수집ㆍ보존 등에 필요한 사항은 대통령령으로 정한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제46조의2","label":"제46조의2","title":"헌법기관기록물관리기관 등의 민간기록물 수집","chap":"제10장 민간기록물 등의 수집ㆍ관리","text":"헌법기관기록물관리기관 및 지방기록물관리기관의 장은 소관업무, 관할 공공기관 또는 관할 지역과 관련하여 보존가치가 높은 민간기록물을 수집할 수 있다. 이 경우 민간기록물의 수집ㆍ보존에 필요한 사항은 국회규칙, 대법원규칙, 헌법재판소규칙, 중앙선거관리위원회규칙, 시ㆍ도 및 시ㆍ군ㆍ자치구의 조례로 정한다.","note":"[본조신설 2019. 12. 3.]"},{"id":"제46조의3","label":"제46조의3","title":"유네스코 국제기록유산센터의 설립","chap":"제10장의2 기록문화 확산 기반 구축 등","text":"① 세계의 기록유산 관리 및 보존에 관한 연구, 교육, 훈련 및 정책 개발을 위하여 유네스코 국제기록유산센터(이하 “기록유산센터”라 한다)를 설립한다.\n② 기록유산센터는 법인으로 한다.\n③ 기록유산센터는 다음 각 호의 사업을 수행한다. 다만, 「국가유산기본법」 제31조에 따라 유네스코에 등재된 국가유산과 관련된 사항은 국가유산청장과 협의하여야 한다.<개정 2023. 5. 16., 2024. 2. 13.>\n1. 유네스코 세계기록유산 프로그램 모니터링 및 지원\n2. 세계의 기록유산 관리와 보존을 위한 디지털화\n3. 세계의 기록유산 관리와 보존 및 활용에 관한 연구 및 콘텐츠 개발\n4. 세계의 기록유산 관리와 보존 및 활용에 관한 교육ㆍ훈련\n5. 세계의 기록유산에 관한 홍보\n6. 기록유산 분야의 국내외 교류ㆍ협력 사업\n7. 그 밖에 세계의 기록유산 관리와 보존에 필요한 사업\n④ 기록유산센터에 정관으로 정하는 바에 따라 임원과 필요한 직원을 둔다.\n⑤ 기록유산센터에 관하여 이 법에서 정한 것 외에는 「민법」 중 재단법인에 관한 규정을 준용한다.\n⑥ 국가는 예산의 범위에서 기록유산센터의 운영에 필요한 경비를 지원할 수 있다.\n⑦ 지방자치단체는 기록유산센터의 업무 수행을 위하여 필요한 경우에는 「공유재산 및 물품 관리법」에도 불구하고 공유재산을 무상으로 사용ㆍ수익하게 할 수 있다.","note":"[본조신설 2019. 12. 3.]"},{"id":"제46조의4","label":"제46조의4","title":"기록의 날 지정","chap":"제10장의2 기록문화 확산 기반 구축 등","text":"① 우수한 기록문화 전통을 계승하고 기록의 중요성을 국민에게 알리기 위하여 매년 6월 9일을 기록의 날로 지정한다.\n② 공공기관은 기록의 날이 포함된 주간에 기록문화 확산을 위한 각종 행사를 실시할 수 있다.","note":"[본조신설 2019. 12. 3.]"},{"id":"제47조","label":"제47조","title":"비밀 누설의 금지","chap":"제11장 보칙","text":"비밀 기록물 관리 업무를 담당하였거나 비밀 기록물에 접근ㆍ열람하였던 자는 그 과정에서 알게 된 비밀을 누설하여서는 아니 된다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제48조","label":"제48조","title":"보존매체에 수록된 기록물의 원본 추정","chap":"제11장 보칙","text":"기록물관리기관이 대통령령으로 정한 기준과 절차에 따라 보존매체에 수록한 기록물은 원본과 같은 것으로 추정한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제49조","label":"제49조","title":"위임규정","chap":"제11장 보칙","text":"이 법 시행에 필요한 사항은 국회규칙, 대법원규칙, 헌법재판소규칙, 중앙선거관리위원회규칙 및 대통령령으로 정한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"제50조","label":"제50조","title":"벌칙","chap":"제12장 벌칙","text":"다음 각 호의 어느 하나에 해당하는 자(기록물을 취득할 당시에 공무원이나 공공기관의 임직원이 아닌 사람은 제외한다)는 7년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.\n1. 제19조의2를 위반하여 기록물을 국외로 반출한 사람\n2. 제27조제1항 또는 제2항을 위반하여 심사와 심의를 거치지 아니하거나 기준과 절차를 준수하지 아니하고 기록물을 폐기한 사람\n3. 제27조의3제1항에 따라 폐기 금지의 통보를 받은 기록물을 폐기한 사람","note":"[전문개정 2012. 3. 21.]"},{"id":"제51조","label":"제51조","title":"벌칙","chap":"제12장 벌칙","text":"다음 각 호의 어느 하나에 해당하는 자(제1호부터 제3호까지의 경우에는 기록물을 취득할 당시에 공무원이나 공공기관의 임직원이 아닌 사람은 제외한다)는 3년 이하의 징역 또는 2천만원 이하의 벌금에 처한다. <개정 2019. 12. 3.>\n1. 제19조의2를 위반하여 기록물을 은닉하거나 유출한 사람\n2. 기록물을 중과실로 멸실시킨 자\n3. 기록물을 고의 또는 중과실로 그 일부 내용이 파악되지 못하도록 손상시킨 자\n4. 제37조제2항을 위반하여 비공개 기록물에 관한 정보를 목적 외의 용도로 사용한 자","note":"[전문개정 2012. 3. 21.]"},{"id":"제52조","label":"제52조","title":"벌칙","chap":"제12장 벌칙","text":"다음 각 호의 어느 하나에 해당하는 자는 2년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.\n1. 정당한 사유 없이 제26조제2항에 따른 조사를 거부ㆍ방해 또는 기피한 자\n2. 제47조를 위반하여 업무처리 중 알게 된 비밀을 누설한 자","note":"[전문개정 2012. 3. 21.]"},{"id":"제53조","label":"제53조","title":"과태료","chap":"제12장 벌칙","text":"① 다음 각 호의 어느 하나에 해당하는 자에게는 100만원 이하의 과태료를 부과한다.\n1. 제43조제3항에 따른 조사를 거부ㆍ방해 또는 기피한 자\n2. 제44조에 따른 신고를 하지 아니한 자\n② 제1항에 따른 과태료는 중앙기록물관리기관의 장이 부과ㆍ징수한다.","note":"[전문개정 2012. 3. 21.]"},{"id":"부칙","label":"부칙","title":"<제21066호,2025. 10. 1.>(방송미디어통신위원회의 설치 및 운영에 관한 법률)","chap":"부칙","text":"제1조(시행일) 이 법은 공포한 날부터 시행한다. 다만, 부칙 제7조에 따라 개정되는 법률 중 이 법 시행 전에 공포되었으나 시행일이 도래하지 아니한 법률을 개정한 부분은 각각 해당 법률의 시행일부터 시행한다.\n제2조부터 제6조까지 생략\n제7조(다른 법률의 개정) ①부터 ③까지 생략\n④ 공공기록물 관리에 관한 법률 일부를 다음과 같이 개정한다.\n제46조제4항 전단 중 “과학기술정보통신부장관 또는 방송통신위원회”를 “방송미디어통신위원회”로 한다.\n⑤부터 …까지 생략\n제8조 생략"}]}};
const LKEY='rk-law-v1';let L={};
const lawData=id=>L[id]||BUILTIN[id]||null;
function loadL(){try{L=JSON.parse(localStorage.getItem(LKEY))||{}}catch(e){L={}}}
function saveL(){try{localStorage.setItem(LKEY,JSON.stringify(L));return true}catch(e){return false}}
function parseLaw(text){
  const lines=String(text).replace(/\r/g,'').split('\n');
  const reArt=/^(제\s?\d+\s?조(?:\s?의\s?\d+)?)\s*\(([^)]{1,60})\)\s*(.*)$/;
  const reChap=/^제\s?\d+\s?(?:장|절|관)(?:의\s?\d+)?\s+\S.*$/;
  const raw=[];let chap='',cur=null,app=0;
  for(let ln of lines){ln=ln.trim();if(!ln)continue;
    if(/^부칙(\s|<|$)/.test(ln)){app++;chap=ln.length<70?ln:'부칙';cur=null;continue}
    if(!app&&reChap.test(ln)&&ln.length<60){chap=ln;cur=null;continue}
    const m=reArt.exec(ln);
    if(m){const num=m[1].replace(/\s/g,'');const pre=app?'부칙'+app+' ':'';
      cur={id:pre+num,label:pre+num,title:m[2],chap,text:m[3]||''};raw.push(cur);continue}
    if(cur)cur.text+=(cur.text?'\n':'')+ln}
  const best={},order=[];
  const effOf=t=>{const m=/\[시행일:\s*([^\]]+)\]/.exec(t);return m?m[1].trim():''};
  const clean=t=>t.split('\n').filter(x=>!/^\[시행일:[^\]]*\]\s*제\s?\d+\s?조/.test(x.trim())).join('\n');
  raw.forEach(a=>{const b=best[a.id];
    if(!b){best[a.id]=a;order.push(a.id)}
    else if(!b.text&&a.text)best[a.id]=a;
    else if(a.text&&b.text&&!b.next&&clean(a.text)!==clean(b.text)){b.next={eff:effOf(a.text)||'시행 예정',title:a.title,text:clean(a.text)}}});
  order.forEach(id=>{const b=best[id];if(b.text)b.text=clean(b.text)});
  return{arts:order.map(id=>best[id])}}
function aLink(label,href,cls){return h('a',{class:cls||'btn sm',href,target:'_blank',rel:'noopener noreferrer'},label)}
function refCard(t){
  const ex=EXTRA[t.id];if(!ex)return null;const btns=[];
  (ex.law||[]).forEach(([id,art])=>{const l=lawById(id);const DD=lawData(id);const has=DD&&DD.arts.some(a=>a.id===art);const label=l.short+' '+art;
    btns.push(has?h('button',{class:'btn sm',type:'button',on:{click:()=>go('law',{lsub:'read',law:id,artId:art})}},label+' 읽기'):aLink(label+' (법제처)',lawUrl(id,art)))});
  (ex.links||[]).forEach(([label,url])=>btns.push(aLink(label,url)));
  if(!btns.length)return null;
  return card(h('h3',null,'원문·자료 바로가기'),h('div',{class:'chips',style:'margin-top:10px'},btns))}
function viewLaw(){
  const l=lawById(nav.law);
  if(nav.lsub==='import'&&l)return viewLawImport(l);
  if(nav.lsub==='read'&&l&&lawData(l.id))return viewLawRead(l);
  return viewLawHome()}
function viewLawHome(){
  return h('div',{class:'stack'},
    h('h2',null,'법령 원문'),
    h('p',{class:'sub'},'공공기록물법은 법제처 본문이 앱에 들어 있어서 바로 읽을 수 있어요. 시행령·시행규칙은 법제처 본문을 붙여 넣으면 같은 방식으로 볼 수 있습니다.'),
    LAWS.map(l=>{const D=lawData(l.id);const own=!!L[l.id];
      return card(h('h3',null,l.name),
        h('p',{class:'msg',style:'margin:4px 0 10px'},D?(own?('내가 가져온 본문 · 조문 '+D.arts.length+'개 · 저장일 '+D.saved):('내장본 · 조문 '+D.arts.length+'개 · '+D.info)):'아직 가져오지 않았어요.'),
        h('div',{class:'chips'},
          D?h('button',{class:'btn sm primary',type:'button',on:{click:()=>go('law',{lsub:'read',law:l.id,artId:null})}},'읽기'):null,

  if(j==='을'||j==='를')return bt?'을':'를';if(j==='과'||j==='와')return bt?'과':'와';

    const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(s)+'&langpair='+lang+'|ko'+(email?'&de='+encodeURIComponent(email):'');
    const r=await fetch(url,{signal});
    if(!r.ok)throw{code:'http'+r.status};
    const j=await r.json();
    const t=j&&j.responseData&&j.responseData.translatedText;
    if(!t||/MYMEMORY WARNING/i.test(t)||+j.responseStatus===429)throw{code:'quota'};
    if(j.responseStatus&&+j.responseStatus!==200)throw{code:'mm'};
    res.push(t);onProg(res.length)}
  return res}
function trErr(e){const c=e&&e.code;
  if(c==='cancelled'||(e&&e.name==='AbortError'))return '중지했어요.';
  if(c==='noengine')return '이 브라우저에는 내장 번역이 없어요. 번역 엔진을 "무료 번역 서비스"로 바꿔 보세요.';
  if(c==='quota')return '오늘 무료 번역 한도를 다 썼어요. 아래 이메일 칸에 주소를 넣으면 한도가 늘어나고, 내일 다시 시도해도 돼요.';
  if(c==='http429')return '요청이 너무 많아요. 잠시 뒤 다시 눌러 주세요.';
  if(e&&e.name==='TypeError')return '인터넷에 연결되어 있지 않거나 번역 서비스에 닿지 못했어요.';
  return '번역하지 못했어요. 문장을 줄여서 다시 시도해 주세요.'}

    new Date(x.t).toLocaleDateString('ko-KR')+' · '+x.src.replace(/\s+/g,' ').slice(0,48)));
  return h('div',{class:'stack'},
    h('h2',null,'원문 번역'),
    h('div',{class:'notice'},h('b',null,'알아 두세요'),
      h('p',null,'기계번역은 shall·should 같은 조동사와 부정 표현에서 틀릴 수 있어요. 중요한 조항은 원문과 꼭 대조하세요.'),
      h('p',null,'"무료 번역 서비스"를 쓰면 입력한 문장이 외부 서비스로 전송됩니다. 브라우저 내장 번역은 기기 안에서 처리돼요. 이 앱에는 ISO 원문이 들어 있지 않으니, 열람 권한이 있는 표준의 일부 문단만 개인 학습용으로 넣으세요.')),
    card(h('div',{class:'stack'},
      h('div',{class:'field'},h('label',{for:'tr-src'},'원문'),src,h('div',{class:'row between'},count,h('button',{class:'btn sm ghost',type:'button',on:{click:()=>{trState.src='';trState.rows=null;render()}}},'비우기'))),
      h('div',{class:'grid2'},h('div',{class:'field'},h('label',{for:'tr-lang'},'원문 언어'),lang),h('div',{class:'field'},h('label',{for:'tr-view'},'보기'),view)),
      h('div',{class:'field'},h('label',{for:'tr-engine'},'번역 엔진'),eng),
      h('div',{class:'field'},h('label',{for:'tr-mail'},'무료 서비스 한도 확대'),mail),
      run,stop,msg)),
    trState.rows?card(h('div',{class:'row between'},h('h3',null,'번역 결과'),cp),

    S.tr.length?h('div',{class:'stack',style:'gap:8px'},h('h3',null,'최근 번역'),h('div',{class:'hist'},hist)):null)}

  a.href=URL.createObjectURL(b);a.download='rk-standards-backup-'+today()+'.json';document.body.append(a);a.click();a.remove();

function importData(file,msg){const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object')throw 0;
    if(o.S){S=Object.assign(S,o.S);if(o.L&&typeof o.L==='object'){L=o.L;saveL()}}else S=Object.assign(S,o);
    save();render()}
    catch(e){msg.className='msg err';msg.textContent='백업 파일을 읽지 못했어요.'}};

/* ───────── 복습 (간격 반복 카드, 오답노트, 즐겨찾기) ───────── */
const GAP=[1,3,7,14,30];
let C=null;
function viewReview(){
  if(nav.rsub==='cards')return viewCards();
  const di=dueInfo(),tot=totals();
  const wrong=pool('wrong'),bm=pool('bm');
  const byArea=Object.keys(AREAS).map(a=>{const ids=TOPICS.filter(t=>t.area===a).map(t=>t.id);let ok=0,no=0;allQ().filter(q=>ids.includes(q.topic)).forEach(q=>{const s=S.stats[q.id];if(s){ok+=s.ok;no+=s.no}});return{a,ok,no}});
  return h('div',{class:'stack'},
    card(h('h3',null,'용어 카드 (간격 반복)'),h('p',{class:'sub',style:'margin:4px 0 10px'},'외운 카드는 1·3·7·14·30일 간격으로 다시 나타납니다.'),
      h('button',{class:'btn primary block',type:'button',on:{click:()=>startCards()}},'복습 '+di.due+'개 · 새 카드 '+di.fresh+'개 시작')),
    card(h('div',{class:'row between'},h('h3',null,'오답노트'),h('span',{class:'tag'},wrong.length+'문항')),
      wrong.length?h('div',{class:'stack',style:'margin-top:10px'},wrong.slice(0,4).map(q=>h('p',{class:'sub'},'· '+q.q)),
        h('button',{class:'btn block',type:'button',on:{click:()=>startQuiz('wrong','',20,'practice')}},'오답 다시 풀기')):h('p',{class:'sub',style:'margin-top:6px'},'틀린 문제가 여기에 모입니다.')),
    card(h('div',{class:'row between'},h('h3',null,'즐겨찾기'),h('span',{class:'tag'},bm.length+'문항')),
      bm.length?h('button',{class:'btn block',type:'button',style:'margin-top:10px',on:{click:()=>startQuiz('bm','',20,'practice')}},'즐겨찾기 문제 풀기'):h('p',{class:'sub',style:'margin-top:6px'},'퀴즈 중 별표를 누르면 저장됩니다.')),
    card(h('h3',null,'영역별 정답률'),h('div',{style:'height:10px'}),
      h('div',{class:'list'},byArea.map(x=>{const n=x.ok+x.no,p=n?Math.round(100*x.ok/n):0;
        return h('div',{class:'stack',style:'gap:6px'},h('div',{class:'row between'},h('span',null,AREAS[x.a]),h('span',{class:'mono msg'},n?p+'% ('+n+'회)':'기록 없음')),h('div',{class:'bar good'},h('i',{style:'width:'+p+'%'})))}))),
    S.hist.length?card(h('h3',null,'최근 퀴즈'),h('div',{class:'hist',style:'margin-top:8px'},S.hist.slice(-5).reverse().map(x=>h('div',{class:'msg mono'},x.d+' · '+(x.m==='exam'?'모의':'연습')+' · '+x.s+'/'+x.n)))):null)}
function startCards(){const t=today(),dueIds=[],fresh=[];
  TERMS.forEach((_,i)=>{const c=S.cards[i];if(c&&c.due<=t)dueIds.push(i)});
  const used=S.newToday.d===t?S.newToday.n:0;let room=Math.max(0,10-used);
  TERMS.forEach((_,i)=>{if(!S.cards[i]&&room>0){fresh.push(i);room--}});
  const q=shuffle(dueIds).concat(fresh);
  if(!q.length){nav.rsub='cards';C={q:[],i:0,flip:false,dir:'ko',done:0};render();return}
  C={q,i:0,flip:false,dir:(C&&C.dir)||'ko',done:0};nav.rsub='cards';render()}
function viewCards(){
  if(!C)C={q:[],i:0,flip:false,dir:'ko',done:0};
  const back=h('button',{class:'back',type:'button',on:{click:()=>{C=null;nav.rsub='menu';render()}}},'← 복습 메뉴');
  if(C.i>=C.q.length)return h('div',{class:'stack'},back,card(h('h3',null,C.done?'오늘 카드 복습을 마쳤어요':'지금 복습할 카드가 없어요'),h('p',{class:'sub',style:'margin-top:6px'},C.done?C.done+'장을 복습했어요.':'새 카드는 하루 10장까지 보여 줍니다. 내일 다시 오세요.')));
  const id=C.q[C.i],t=TERMS[id];
  const front=C.dir==='ko'?h('div',{class:'big'},t[0]):h('div',{class:'en'},t[1]);
  const ans=C.dir==='ko'?h('div',{class:'en'},t[1]):h('div',{class:'big'},t[0]);
  const fc=h('div',{class:'card flash',role:'button',tabindex:'0',on:{click:()=>{C.flip=true;render()},keydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();C.flip=true;render()}}}},
    front,C.flip?[ans,h('p',{class:'sub'},t[2])]:h('p',{class:'msg'},'눌러서 답 보기'));
  const dir=h('div',{class:'seg',role:'group'},[['ko','한글 → 영문'],['en','영문 → 한글']].map(([k,l])=>h('button',{type:'button','aria-pressed':C.dir===k?'true':'false',on:{click:()=>{C.dir=k;C.flip=false;render()}}},l)));
  return h('div',{class:'stack'},back,dir,h('div',{class:'row between'},h('span',{class:'mono msg'},(C.i+1)+' / '+C.q.length)),fc,
    C.flip?h('div',{class:'grid2'},h('button',{class:'btn',type:'button',on:{click:()=>grade(false)}},'헷갈려요'),h('button',{class:'btn primary',type:'button',on:{click:()=>grade(true)}},'알아요')):null)}
function grade(ok){const id=C.q[C.i],t=today();const c=S.cards[id]||{box:0,due:t};
  if(!S.cards[id]){S.newToday=S.newToday.d===t?S.newToday:{d:t,n:0};S.newToday.n++}
  if(ok){c.box=Math.min(5,c.box+1);c.due=addDays(t,GAP[c.box-1])}else{c.box=1;c.due=addDays(t,1);C.q.push(id)}
  S.cards[id]=c;C.i++;C.flip=false;if(ok)C.done++;touch();save();render()}
